  <!-- เมนูสองชั้น (แถบไอคอน + แผงเมนูย่อย) สร้างจาก window.TFC_MENU ที่กรองสิทธิ์มาแล้ว -->

  <script src="../../assets/js/mock-data.js"></script>
  <script src="../../assets/js/menu-config.js"></script>
  <script src="../../assets/js/sidebar-render.js"></script>

  <div class="app-main">
    <main class="content">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="../dashboard.html">แดชบอร์ด</a> <span>/</span>
        <a href="list.html">รายการกิจกรรม</a> <span>/</span>
        <a href="detail.html">ปลูกผักปลอดสารสำหรับครอบครัว</a> <span>/</span>
        <span class="is-current">กำหนดการเผยแพร่</span>
      </nav>
      <div class="page-header">
        <div class="page-header-text">
          <h1>กำหนดการเผยแพร่</h1>
        </div>
      </div>

      <form data-mock-submit="บันทึกกำหนดการเผยแพร่สำเร็จ" data-mock-redirect="detail.html">

        <div class="card mb-5">
          <h2 class="card-title">สถานะการเผยแพร่</h2>
          <div class="form-group">
            <label class="checkbox-item mb-2">
              <input type="checkbox" id="publish-now" checked>
              <span>เผยแพร่กิจกรรมนี้บนหน้าเว็บสาธารณะทันที</span>
            </label>
            <div class="form-helper">หากปิดไว้ กิจกรรมจะถูกบันทึกเป็นฉบับร่าง มองเห็นได้เฉพาะเจ้าหน้าที่</div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="publish-date">วันที่เริ่มเผยแพร่</label>
              <input class="input" type="text" id="publish-date" data-picker="date" data-iso="2026-08-03" placeholder="เลือกวันที่">
            </div>
            <div class="form-group">
              <label class="form-label" for="publish-time">เวลา</label>
              <input class="input" type="text" id="publish-time" data-picker="time" data-iso="09:00" placeholder="09:30">
            </div>
          </div>
        </div>

        <div class="card mb-5">
          <h2 class="card-title">การมองเห็นและสิทธิ์การลงทะเบียน</h2>
          <div class="form-group">
            <label class="form-label" for="publish-visibility">ระดับการมองเห็น</label>
            <select class="select" id="publish-visibility">
              <option>สาธารณะ — ทุกคนเห็นและลงทะเบียนได้</option>
              <option>เฉพาะลิงก์ — เห็นเฉพาะผู้มีลิงก์</option>
              <option>ปิดการลงทะเบียน — แสดงผลอย่างเดียว</option>
            </select>
          </div>
          <div class="form-group mb-0">
            <label class="checkbox-item">
              <input type="checkbox" checked>
              <span class="small">แสดงในหน้ากิจกรรมแนะนำ (Featured)</span>
            </label>
          </div>
        </div>

        <div class="alert alert-info mb-5">
          <span class="alert-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></span>
          <div>เมื่อเผยแพร่แล้ว กิจกรรมนี้จะแสดงในหน้าเว็บสาธารณะ (จะพัฒนาในระยะที่ 6: หน้าสาธารณะ)</div>
        </div>

        <div class="form-action-bar">
          <button type="button" class="btn btn-outline" data-go-back>ยกเลิก</button>
          <button type="submit" class="btn btn-primary">บันทึกการตั้งค่า</button>
        </div>
      </form>
    </main>
  </div>
</div>
