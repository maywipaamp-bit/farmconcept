  <div class="modal modal-sm">

      <p class="text-secondary">กิจกรรมที่ใช้หมวดหมู่นี้จะไม่ถูกลบ แต่จะไม่มีหมวดหมู่อ้างอิงอีกต่อไป</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close-modal>ยกเลิก</button>
      <button class="btn btn-danger" id="fmt-delete-confirm" data-close-modal>ลบหมวดหมู่กิจกรรม</button>

<script src="../../assets/js/data-service.js"></script>
<script src="../../assets/js/navigation.js"></script>
<script src="../../assets/js/modal.js"></script>
<script src="../../assets/js/profile-modal.js"></script>
<script src="../../assets/js/action-menu.js"></script>
<script src="../../assets/js/index-layout.js"></script>
<script src="../../assets/js/toast.js"></script>
<script src="../../assets/js/form.js"></script>
<script src="../../assets/js/smart-select.js"></script>
<script src="../../assets/js/activity-module.js"></script>
<script src="../../assets/js/search-popover.js"></script>
<script src="../../assets/js/field-widgets.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
(function () {
  var pageState = { page: 1, pageSize: 10 };
  var fmtSvc = window.TFC.dataService('activityFormats');
  var mock = window.TFC_MOCK || {};

  /* ตัวเลือกไอคอนหมวดหมู่ — เก็บค่าที่เลือกไว้ในตัวแปร selectedIcon (ไม่มี input จริงในฟอร์ม) */
  var iconList = mock.activityCategoryIcons || [];
  var defaultIcon = (iconList[0] || {}).value || '';
  var selectedIcon = defaultIcon;

  function iconSvg(value) {
    var found = iconList.filter(function (ic) { return ic.value === value; })[0] || iconList[0];
    if (!found) return '';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + found.path + '</svg>';
  }

  var iconPicker = document.getElementById('fmt-icon-picker');
  iconPicker.innerHTML = iconList.map(function (ic) {
    return '<button type="button" class="icon-picker-option" role="radio" aria-checked="false"' +
      ' data-icon="' + ic.value + '" title="' + window.TFC.escapeHtml(ic.label) + '"' +
      ' aria-label="' + window.TFC.escapeHtml(ic.label) + '">' + iconSvg(ic.value) + '</button>';
  }).join('');

  function setSelectedIcon(value) {
    selectedIcon = value || defaultIcon;
    Array.prototype.forEach.call(iconPicker.querySelectorAll('.icon-picker-option'), function (btn) {
      var on = btn.getAttribute('data-icon') === selectedIcon;
      btn.classList.toggle('is-active', on);
      btn.setAttribute('aria-checked', on ? 'true' : 'false');
    });
  }

  iconPicker.addEventListener('click', function (e) {
    var btn = e.target.closest('.icon-picker-option');
    if (btn) setSelectedIcon(btn.getAttribute('data-icon'));
  });
  setSelectedIcon(defaultIcon);

    /* ยอดรวมย้ายจากแถวท้ายตารางมาไว้ใต้ชื่อหน้า คำนวณจากข้อมูลจริง */
  var fmtAll = mock.activityFormats || [];
window.TFC.renderPageHeader('fmt-page-header', {
    title: 'หมวดหมู่กิจกรรม',
    actions: [
      {
        label: 'เพิ่มหมวดหมู่กิจกรรม',
        icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
        attrs: { id: 'fmt-add-btn', 'data-open-modal': 'fmt-form-modal' }
      }
    ]
  });

  document.getElementById('fmt-active').addEventListener('change', function () {
    document.getElementById('fmt-active-label').textContent = this.checked ? 'ใช้งาน' : 'ไม่ใช้งาน';
  });

  function resetForm() {
    document.getElementById('fmt-form-title').textContent = 'เพิ่มหมวดหมู่กิจกรรม';
    document.getElementById('fmt-form').reset();
    setSelectedIcon(defaultIcon);
    document.getElementById('fmt-active').checked = true;
    document.getElementById('fmt-active-label').textContent = 'ใช้งาน';
    document.getElementById('fmt-form').setAttribute('data-editing-id', '');
  }
  document.getElementById('fmt-add-btn').addEventListener('click', resetForm);

  document.addEventListener('click', function (e) {
    var trigger = e.target.closest('[data-action-key^="fmt-edit-"]');
    if (!trigger) return;
    var id = trigger.getAttribute('data-action-key').replace('fmt-edit-', '');
    var fmt = (mock.activityFormats || []).filter(function (f) { return f.id === id; })[0];
    if (!fmt) return;
    document.getElementById('fmt-form-title').textContent = 'แก้ไขหมวดหมู่กิจกรรม';
    document.getElementById('fmt-name').value = fmt.name || '';
    setSelectedIcon(fmt.icon);
    document.getElementById('fmt-active').checked = fmt.active !== false;
    document.getElementById('fmt-active-label').textContent = fmt.active !== false ? 'ใช้งาน' : 'ไม่ใช้งาน';
    document.getElementById('fmt-form').setAttribute('data-editing-id', fmt.id);
  });

  function renderTable() {
    fmtSvc.list().then(function (formats) {
      var keyword = ((document.getElementById('fmt-search') || {}).value || '').trim().toLowerCase();
      var filtered = formats.filter(function (f) {
        return !keyword || f.name.toLowerCase().indexOf(keyword) !== -1;
      });

      var pageCount = Math.max(1, Math.ceil(filtered.length / pageState.pageSize));
      if (pageState.page > pageCount) pageState.page = pageCount;
      var start = (pageState.page - 1) * pageState.pageSize;
      var pageRows = filtered.slice(start, start + pageState.pageSize);

      document.getElementById('fmt-table-body').innerHTML = pageRows.map(function (f, i) {
        return '<tr>' +
          '<td class="col-no nowrap">' + (start + i + 1) + '</td>' +
          '<td><span class="cell-icon">' + iconSvg(f.icon) + '<span>' + window.TFC.escapeHtml(f.name) + '</span></span></td>' +
          '<td><div class="cell-updated-by">' + window.TFC.escapeHtml(f.updatedBy || '-') + '</div>' +
          '<div class="cell-updated-at">' + (f.updatedAt ? window.TFC.formatThaiDate(f.updatedAt) : '-') + '</div></td>' +
          '<td class="table-row-actions">' +
          window.TFC.actionMenuTrigger([
            { key: 'fmt-edit-' + f.id, label: 'แก้ไข', icon: 'edit', modal: 'fmt-form-modal', perm: 'master_data' },
            { key: 'fmt-delete-' + f.id, label: 'ลบหมวดหมู่กิจกรรม', icon: 'delete', modal: 'fmt-delete-modal', perm: 'master_data', danger: true }
          ]) +
          '</td></tr>';
      }).join('');
      /* แถวสรุปท้ายตารางถูกตัดออก — ยอดรวมย้ายไปอยู่บรรทัดใต้ชื่อหน้าแทน */

      window.TFC.renderPagination('format-pagination', {
        page: pageState.page,
        pageSize: pageState.pageSize,
        total: filtered.length,
        pageSizeOptions: [10, 20, 50],
        footer: true,
        onChange: function (p) { pageState.page = p; renderTable(); },
        onPageSizeChange: function (size) { pageState.pageSize = size; pageState.page = 1; renderTable(); }
      });
    });
  }

  /* แถบค้นหา/ตัวกรองย้ายเข้า Search Panel Popover — ใช้ id เดิมเพื่อให้ renderTable() อ่านค่าได้เหมือนเดิม */
  window.TFC.attachListToolbar({
    chipId: 'format-filter-chip',
    chipLabelId: 'format-filter-chip-label',
    popoverId: 'format-search-popover',
    search: { id: 'fmt-search', placeholder: 'ค้นหาชื่อหมวดหมู่กิจกรรม' },
    onApply: function (values, done) {
      pageState.page = 1;
      renderTable();
      done();
    }
  });

  /* ปุ่มดาวน์โหลดถูกตัดออกจากแถวชื่อหน้าแล้ว จึงผูก event เฉพาะเมื่อยังมีปุ่มอยู่
     ฟังก์ชัน exportTableCsv ยังอยู่ครบ ถ้าจะเอาปุ่มกลับมาก็เพิ่ม element id เดิมได้ทันที */
  var exportBtn = document.getElementById('format-export');
  if (exportBtn) {
    exportBtn.addEventListener('click', function () {
    window.TFC.exportTableCsv('#fmt-table-body', 'หมวดหมู่กิจกรรม.csv');
    });
  }

  document.getElementById('fmt-form').addEventListener('submit', function () {
    var editingId = this.getAttribute('data-editing-id');
    var payload = {
      name: document.getElementById('fmt-name').value,
      icon: selectedIcon,
      active: document.getElementById('fmt-active').checked,
      updatedBy: (mock.currentUser || {}).name || ''
    };
    var save = editingId ? fmtSvc.update(editingId, payload) : fmtSvc.create(payload);
    save.then(renderTable);
  });

  renderTable();

  /* ลบรายการ: จำ id จากเมนู ⋮ แล้วลบจริงเมื่อกดยืนยันในโมดัล */
  var pendingDeleteId = null;
  document.addEventListener('click', function (e) {
    var item = e.target.closest('[data-action-key^="fmt-delete-"]');
    if (item) pendingDeleteId = item.getAttribute('data-action-key').replace('fmt-delete-', '');
  });

  document.getElementById('fmt-delete-confirm').addEventListener('click', function () {
    if (!pendingDeleteId) return;
    fmtSvc.remove(pendingDeleteId).then(function () {
      pendingDeleteId = null;
      renderTable();
      if (window.TFC.showToast) window.TFC.showToast('ลบหมวดหมู่กิจกรรมเรียบร้อย', 'success');
    });
  });
})();
</script>
</body>
