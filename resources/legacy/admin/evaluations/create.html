<!DOCTYPE html>
<html lang="th" class="is-preload">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สร้างแบบประเมิน | TheFarmConcept</title>
<link rel="icon" type="image/png" href="../../assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../../assets/css/standard/tokens.css">
<link rel="stylesheet" href="../../assets/css/standard/base.css">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/layout.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/utilities.css">
<link rel="stylesheet" href="../../assets/css/responsive.css">
<link rel="stylesheet" href="../../assets/css/typography-spec.css">
<link rel="stylesheet" href="../../assets/css/sidebar-shell.css">
</head>
<body>

<div class="app-shell">
<script>(function(){try{if(localStorage.getItem('tfc-subnav-collapsed')==='1'){document.currentScript.parentElement.classList.add('is-subnav-collapsed');}}catch(e){}})();</script>
  <!-- เมนูสองชั้น (แถบไอคอน + แผงเมนูย่อย) สร้างจาก window.TFC_MENU ที่กรองสิทธิ์มาแล้ว -->
  <div id="sidebar-shell" data-nav-base="../../"></div>

  <script src="../../assets/js/mock-data.js"></script>
  <script src="../../assets/js/menu-config.js"></script>
  <script src="../../assets/js/sidebar-render.js"></script>

  <div class="app-main">
    <main class="content ec-content">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="../dashboard.html">แดชบอร์ด</a> <span>/</span>
        <span>ประเมินสุขภาพ</span> <span>/</span>
        <a href="list.html">แบบประเมิน</a> <span>/</span>
        <span class="is-current">สร้างแบบประเมิน</span>
      </nav>
      <div class="ec-header">
        <a class="ec-back" href="list.html" aria-label="ย้อนกลับไปรายการแบบประเมิน">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg>
        </a>
        <div class="ec-header-text">
          <h1 class="ec-title">สร้างแบบประเมิน</h1>
        </div>
      </div>

      <div class="ec-layout">
        <div class="ec-main">

          <!-- ---------- 1. แบบประเมินชุดนี้คืออะไร ---------- -->
          <section class="card ec-section">
            <div class="ec-section-head">
              <span class="ec-section-no">1</span>
              <h2 class="ec-section-title">แบบประเมินชุดนี้คืออะไร</h2>
            </div>

            <div class="ec-field">
              <label class="form-label" for="ec-name">ชื่อชุดแบบประเมิน<span class="form-required">*</span></label>
              <input type="text" class="input" id="ec-name" placeholder="เช่น แบบประเมินความพึงพอใจ" autocomplete="off">
            </div>

            <div class="ec-field">
              <label class="form-label" for="ec-desc">คำอธิบายสั้น ๆ</label>
              <input type="text" class="input" id="ec-desc" placeholder="ใช้เมื่อไหร่ ถามอะไร เพื่อให้เจ้าหน้าที่คนอื่นเลือกถูกชุด" autocomplete="off">
            </div>

            <div class="ec-field">
              <label class="form-label">ใช้ตอนไหน<span class="form-required">*</span></label>
              <div class="ec-picks" id="ec-stages"></div>
            </div>

          </section>

          <!-- ---------- 2. คำถาม ---------- -->
          <section class="card ec-section">
            <div class="ec-section-head ec-section-head-split">
              <div class="ec-section-head">
                <span class="ec-section-no">2</span>
                <h2 class="ec-section-title">คำถาม</h2>
              </div>
              <span class="ec-summary" id="ec-summary"></span>
            </div>

            <div class="ec-items" id="ec-items"></div>

          </section>
        </div>

        <!-- ---------- แผงขวา ---------- -->
        <aside class="ec-side">
          <div class="card ec-preview-card">
            <div class="ec-preview-head">
              <span class="ec-panel-title">ตัวอย่างที่ผู้ตอบเห็น</span>
              <span class="ec-live">อัปเดตสด</span>
            </div>
            <div class="ec-preview-body">
              <div class="ec-preview-intro">
                <span class="ec-preview-name" id="ec-preview-name">ชื่อชุดแบบประเมิน</span>
                <span class="ec-preview-desc" id="ec-preview-desc">คำอธิบายจะแสดงตรงนี้</span>
              </div>
              <div class="ec-preview-list" id="ec-preview-list"></div>
              <button type="button" class="btn btn-primary btn-block btn-sm ec-preview-submit" disabled>ส่งแบบประเมิน</button>
            </div>
          </div>

          <div class="card ec-panel">
            <div class="ec-preview-head">
              <span class="ec-panel-title">ก่อนบันทึก</span>
              <span class="ec-done-badge" id="ec-done-badge">0/5</span>
            </div>
            <div class="ec-checklist" id="ec-checklist"></div>
          </div>
        </aside>
      </div>
    </main>

    <div class="ec-bottombar">
      <div class="ec-bottombar-inner">
        <span class="ec-progress-text" id="ec-progress-text"></span>
        <div class="ec-bottombar-actions">
          <a class="btn btn-ghost" href="list.html" id="ec-cancel">ยกเลิก</a>
          <button type="button" class="btn btn-outline" id="ec-save-draft">บันทึกร่าง</button>
          <button type="button" class="btn btn-primary" id="ec-save" disabled>บันทึกและเปิดใช้งาน</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../../assets/js/data-service.js"></script>
<script src="../../assets/js/navigation.js"></script>
<script src="../../assets/js/modal.js"></script>
<script src="../../assets/js/profile-modal.js"></script>
<script src="../../assets/js/action-menu.js"></script>
<script src="../../assets/js/toast.js"></script>
<script src="../../assets/js/form.js"></script>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/evaluation-create.js"></script>
</body>
</html>
