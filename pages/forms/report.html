<script>
(function () {
  var formId = new URLSearchParams(window.location.search).get('form');
  var form = (window.TFC_MOCK.forms || []).filter(function (f) { return f.id === formId; })[0];
  if (!form) {
    document.getElementById('rpt-form-name').textContent = 'ไม่พบแบบฟอร์มที่ระบุ';
    return;
  }
  document.getElementById('rpt-form-name').textContent = form.name;

  var questions = (window.TFC_MOCK.formQuestions && window.TFC_MOCK.formQuestions[formId]) || [];
  var respondents = (window.TFC_MOCK.formResponses && window.TFC_MOCK.formResponses[formId]) || [];
  var scored = respondents.filter(function (r) { return typeof r.score === 'number'; });
  var avgScore = scored.length ? (scored.reduce(function (sum, r) { return sum + r.score; }, 0) / scored.length) : null;

  document.getElementById('rpt-stat-list').innerHTML =
    '<div class="stat-item"><div class="stat-value">' + respondents.length + '</div><div class="stat-label">จำนวนผู้ตอบ</div></div>' +
    '<div class="stat-item"><div class="stat-value">' + (avgScore !== null ? avgScore.toFixed(1) : '-') + '</div><div class="stat-label">คะแนนเฉลี่ยรวม</div></div>' +
    '<div class="stat-item"><div class="stat-value">' + questions.length + '</div><div class="stat-label">จำนวนคำถาม</div></div>';

  document.getElementById('rpt-summary-list').innerHTML = questions.map(function (q, index) {
    var isRating = q.type.indexOf('คะแนน') !== -1;
    var ratingAnswers = scored.map(function (r) { return r.answers ? r.answers[index + 1] : null; }).filter(function (v) { return typeof v === 'number'; });
    var avg = ratingAnswers.length ? (ratingAnswers.reduce(function (a, b) { return a + b; }, 0) / ratingAnswers.length) : null;
    var percent = avg !== null ? Math.round((avg / 5) * 100) : 0;
    return '<div class="card">' +
      '<div class="flex items-center justify-between mb-2">' +
      '<h3 class="card-title mb-0">' + window.TFC.escapeHtml(q.text) + '</h3>' +
      '<span class="badge badge-neutral">' + window.TFC.escapeHtml(q.type) + '</span>' +
      '</div>' +
      (isRating && avg !== null
        ? '<div class="progress mb-2"><div class="progress-bar" style="width:' + percent + '%"></div></div><div class="small text-secondary">คะแนนเฉลี่ย ' + avg.toFixed(1) + ' / 5.0 จาก ' + ratingAnswers.length + ' คำตอบ</div>'
        : '<div class="small text-secondary">คำตอบแบบข้อความ/ตัวเลือก — ดูรายละเอียดได้ที่แท็บ "ผู้ตอบรายบุคคล"</div>') +
      '</div>';
  }).join('') || '<div class="state-block"><p class="state-title">ยังไม่มีคำถามในแบบฟอร์มนี้</p></div>';

  document.getElementById('rpt-individual-table-body').innerHTML = respondents.map(function (r) {
    var scoreCell = (typeof r.score === 'number') ? '<span class="badge badge-success">' + r.score.toFixed(1) + ' / 5.0</span>' : '<span class="text-secondary">-</span>';
    return '<tr>' +
      '<td>' + window.TFC.escapeHtml(r.name) + '</td>' +
      '<td>' + r.phone + '</td>' +
      '<td>' + window.TFC.formatThaiDate(r.submittedAt) + '</td>' +
      '<td>' + scoreCell + '</td>' +
      '</tr>';
  }).join('');

  /* Before/after comparison — health_tracking forms only, one row per tracking round of the
     linked sample group, averaging that round's linked form's scored responses. */
  if (form.formType === 'health_tracking' && form.linkedSampleGroupId) {
    document.getElementById('rpt-trend-tab').hidden = false;
    var rounds = (window.TFC_MOCK.trackingRounds || [])
      .filter(function (r) { return r.sampleGroupId === form.linkedSampleGroupId; })
      .sort(function (a, b) { return a.roundNumber - b.roundNumber; });

    document.getElementById('rpt-trend-list').innerHTML = rounds.map(function (r) {
      var roundResponses = (r.formId && window.TFC_MOCK.formResponses[r.formId]) || [];
      var roundScored = roundResponses.filter(function (x) { return typeof x.score === 'number'; });
      var roundAvg = roundScored.length ? (roundScored.reduce(function (sum, x) { return sum + x.score; }, 0) / roundScored.length) : null;
      var percent = roundAvg !== null ? Math.round((roundAvg / 5) * 100) : 0;
      return '<div class="card">' +
        '<div class="flex items-center justify-between mb-2">' +
        '<h3 class="card-title mb-0">รอบที่ ' + r.roundNumber + ' (' + window.TFC.escapeHtml(r.roundLabel) + ')</h3>' +
        '<span class="badge badge-neutral">' + r.status + '</span>' +
        '</div>' +
        (roundAvg !== null
          ? '<div class="progress mb-2"><div class="progress-bar" style="width:' + percent + '%"></div></div><div class="small text-secondary">คะแนนเฉลี่ย ' + roundAvg.toFixed(1) + ' / 5.0 จาก ' + roundScored.length + ' คน</div>'
          : '<div class="small text-secondary">ยังไม่มีข้อมูลคะแนนสำหรับรอบนี้</div>') +
        '</div>';
    }).join('') || '<div class="state-block"><p class="state-title">ยังไม่มีรอบติดตามสำหรับกลุ่มตัวอย่างนี้</p></div>';
  }
})();
</script>
