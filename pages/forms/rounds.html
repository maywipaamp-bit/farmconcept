          <button type="button" class="topbar-profile" data-dropdown-toggle aria-label="เมนูผู้ใช้งาน">

      <div class="page-header">
        <div class="page-header-text">

          <p class="page-description">จัดการรอบติดตามของแต่ละกลุ่มตัวอย่าง และส่งลิงก์แบบประเมินให้สมาชิกที่ยังไม่ตอบ</p>

        <div class="page-header-actions">

      <div class="page-toolbar">
        <select class="select filter-select" id="rnd-filter-group">

        <select class="select filter-select" id="rnd-filter-status">
          <option value="">สถานะทั้งหมด</option>
          <option>เปิดใช้งาน</option>
          <option>รอเปิดใช้งาน</option>

        </select>

</div>

<div class="modal-overlay" id="round-create-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">สร้างรอบติดตามใหม่</h3>
      <button type="button" class="modal-close" data-close-modal aria-label="ปิดหน้าต่าง">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label" for="rnd-group-select">กลุ่มตัวอย่าง<span class="form-required">*</span></label>
        <select class="select" id="rnd-group-select"><option value="">เลือกกลุ่มตัวอย่าง</option></select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="rnd-number">รอบที่<span class="form-required">*</span></label>
          <input class="input" type="number" min="1" id="rnd-number" placeholder="1">
        </div>
        <div class="form-group">
          <label class="form-label" for="rnd-label">ระยะเวลา<span class="form-required">*</span></label>
          <input class="input" id="rnd-label" placeholder="เช่น 3 เดือน">
        </div>
      </div>
      <div class="form-group mb-0">
        <label class="form-label" for="rnd-due">ครบกำหนด<span class="form-required">*</span></label>
        <input class="input" type="date" id="rnd-due">
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline" data-close-modal>ยกเลิก</button>
      <button type="button" class="btn btn-primary" id="rnd-save">บันทึก</button>
    </div>
  </div>
</div>

<script src="../../assets/js/navigation.js"></script>
<script src="../../assets/js/modal.js"></script>
<script src="../../assets/js/action-menu.js"></script>
<script src="../../assets/js/toast.js"></script>
<script src="../../assets/js/form.js"></script>
<script src="../../assets/js/smart-select.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
(function () {
  var sampleGroups = window.TFC_MOCK.sampleGroups || [];
  var rounds = window.TFC_MOCK.trackingRounds || (window.TFC_MOCK.trackingRounds = []);
  var forms = window.TFC_MOCK.forms || [];
  var groupById = {};
  sampleGroups.forEach(function (g) { groupById[g.id] = g; });

  var groupFilterSel = document.getElementById('rnd-filter-group');
  var groupSelectModal = document.getElementById('rnd-group-select');
  sampleGroups.forEach(function (g) {
    var opt1 = document.createElement('option'); opt1.value = g.id; opt1.textContent = g.name; groupFilterSel.appendChild(opt1);
    var opt2 = document.createElement('option'); opt2.value = g.id; opt2.textContent = g.name; groupSelectModal.appendChild(opt2);
  });

  var preselectGroup = new URLSearchParams(window.location.search).get('group');
  if (preselectGroup) groupFilterSel.value = preselectGroup;

  var statusBadge = { 'เปิดใช้งาน': 'badge-success', 'รอเปิดใช้งาน': 'badge-info', 'ปิดรอบแล้ว': 'badge-neutral' };

  function membersNotYetSubmitted(round) {
    var group = groupById[round.sampleGroupId];
    if (!group || !round.formId) return group ? group.members || [] : [];
    var responses = window.TFC_MOCK.formResponses[round.formId] || [];
    var submittedPhones = responses.map(function (r) { return r.phone; });
    return (group.members || []).filter(function (m) { return submittedPhones.indexOf(m.phone) === -1; });
  }

  function render() {
    var groupFilter = groupFilterSel.value;
    var statusFilter = document.getElementById('rnd-filter-status').value;
    var filtered = rounds.filter(function (r) {
      if (groupFilter && r.sampleGroupId !== groupFilter) return false;
      if (statusFilter && r.status !== statusFilter) return false;
      return true;
    });
    document.getElementById('rnd-result-count').textContent = filtered.length;
    document.getElementById('rnd-table-body').innerHTML = filtered.map(function (r) {
      var group = groupById[r.sampleGroupId];
      var linkedForm = forms.filter(function (f) { return f.id === r.formId; })[0];
      var pending = membersNotYetSubmitted(r);
      return '<tr>' +
        '<td>' + window.TFC.escapeHtml(group ? group.name : r.sampleGroupId) + '</td>' +
        '<td>รอบที่ ' + r.roundNumber + '</td>' +
        '<td>' + window.TFC.escapeHtml(r.roundLabel) + '</td>' +
        '<td>' + (linkedForm ? window.TFC.escapeHtml(linkedForm.name) : '<span class="text-secondary">ยังไม่ผูกแบบฟอร์ม</span>') + '</td>' +
        '<td>' + window.TFC.formatThaiDate(r.dueDate) + '</td>' +
        '<td><span class="badge ' + (statusBadge[r.status] || 'badge-neutral') + '">' + r.status + '</span></td>' +
        '<td class="table-row-actions">' +
        (linkedForm && pending.length > 0
          ? '<button type="button" class="btn btn-primary btn-sm" data-send-round="' + r.id + '">ส่งลิงก์ (' + pending.length + ' คน)</button>'
          : '<button type="button" class="btn btn-outline btn-sm" disabled>' + (linkedForm ? 'ส่งครบแล้ว' : 'รอผูกแบบฟอร์ม') + '</button>') +
        '</td></tr>';
    }).join('');
  }

  document.getElementById('rnd-table-body').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-send-round]');
    if (!btn) return;
    var round = rounds.filter(function (r) { return r.id === btn.getAttribute('data-send-round'); })[0];
    if (!round) return;
    var pending = membersNotYetSubmitted(round);
    window.TFC.showToast('ส่งลิงก์แบบติดตามผลให้ ' + pending.length + ' คนที่ยังไม่ตอบแล้ว', 'success');
  });

  groupFilterSel.addEventListener('change', render);
  document.getElementById('rnd-filter-status').addEventListener('change', render);

  document.getElementById('rnd-save').addEventListener('click', function () {
    var groupId = groupSelectModal.value;
    var number = parseInt(document.getElementById('rnd-number').value, 10);
    var label = document.getElementById('rnd-label').value.trim();
    var due = document.getElementById('rnd-due').value;
    if (!groupId || !number || !label || !due) {
      window.TFC.showToast('กรุณากรอกข้อมูลรอบติดตามให้ครบ', 'danger');
      return;
    }
    var nextId = 'RND-' + String(rounds.length + 1).padStart(3, '0');
    rounds.push({ id: nextId, sampleGroupId: groupId, roundNumber: number, roundLabel: label, formId: null, dueDate: due, status: 'รอเปิดใช้งาน' });
    render();
    window.TFC.closeModal('round-create-modal');
    window.TFC.showToast('สร้างรอบติดตามใหม่แล้ว', 'success');
  });

  render();
})();
</script>
</body>
