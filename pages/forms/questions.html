<style>
  .qb-section-card{border:1px solid var(--color-border);}
  .qb-move-btns{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
  .qb-move-btn{width:22px;height:18px;border:1px solid var(--color-border);background:var(--color-surface);border-radius:4px;cursor:pointer;font-size:10px;line-height:1;color:var(--color-text-secondary);display:flex;align-items:center;justify-content:center;padding:0;}
  .qb-move-btn:hover{background:var(--color-primary-soft);border-color:var(--color-primary);color:var(--color-primary-dark);}
  .qb-move-btn:disabled{opacity:.35;cursor:not-allowed;}
  .qb-section-title-input{font-weight:var(--font-weight-semibold);border:none;background:none;padding:4px 6px;flex:1;font-size:var(--font-size-card-title);}
  .qb-section-title-input:focus{outline:1px solid var(--color-primary);border-radius:6px;}
  .qb-section-desc-input{border:none;background:none;padding:4px 6px;width:100%;font-size:var(--font-size-small);color:var(--color-text-secondary);}
  .qb-section-desc-input:focus{outline:1px solid var(--color-primary);border-radius:6px;}
  .qb-question-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-background);}
  .qb-question-info{flex:1;min-width:0;}
  .qb-option-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .qb-option-row .input{flex:1;}
  .qb-option-row .input[data-option-score]{flex:none;width:90px;}
</style>

<script>
(function () {
  var formId = new URLSearchParams(window.location.search).get('form');
  var form = (window.TFC_MOCK.forms || []).filter(function (f) { return f.id === formId; })[0];

  if (!form) {
    document.getElementById('frm-q-form-name').textContent = 'ไม่พบแบบฟอร์มที่ระบุ';
    document.getElementById('frm-add-section-btn').hidden = true;
    return;
  }
  document.getElementById('frm-q-form-name').textContent = form.name;

  window.TFC_MOCK.formSections[formId] = window.TFC_MOCK.formSections[formId] || [];
  window.TFC_MOCK.formQuestions[formId] = window.TFC_MOCK.formQuestions[formId] || [];
  var sections = window.TFC_MOCK.formSections[formId];
  var questions = window.TFC_MOCK.formQuestions[formId];
  var sectionSeq = sections.length, questionSeq = questions.length;
  var editingQuestionId = null;
  var addQuestionSectionId = null;
  var pendingQuestionId = null;
  var pendingDelete = null; // { type: 'section'|'question', id }
  var pendingOptions = [];
  var TYPE_HAS_OPTIONS = { 'ตัวเลือกเดียว': true, 'ตัวเลือกหลายข้อ': true };

  function newSectionId() { return formId + '-S' + (++sectionSeq); }
  function newQuestionId() { return formId + '-Q' + (++questionSeq); }

  function sectionQuestions(sectionId) {
    return questions.filter(function (q) { return q.sectionId === sectionId; })
      .sort(function (a, b) { return a.order - b.order; });
  }

  function syncQuestionCount() { form.questionCount = questions.length; }

  document.getElementById('frm-add-section-btn').addEventListener('click', function () {
    sections.push({ id: newSectionId(), order: sections.length + 1, title: 'Section ' + (sections.length + 1), description: '' });
    render();
  });

  function moveSection(id, dir) {
    var sorted = sections.slice().sort(function (a, b) { return a.order - b.order; });
    var idx = sorted.findIndex(function (s) { return s.id === id; });
    var swapIdx = dir === 'up' ? idx - 1 : idx + 1;
    if (swapIdx < 0 || swapIdx >= sorted.length) return;
    var tmp = sorted[idx].order; sorted[idx].order = sorted[swapIdx].order; sorted[swapIdx].order = tmp;
    render();
  }

  function deleteSection(id) {
    window.TFC_MOCK.formSections[formId] = sections = sections.filter(function (s) { return s.id !== id; });
    window.TFC_MOCK.formQuestions[formId] = questions = questions.filter(function (q) { return q.sectionId !== id; });
    syncQuestionCount();
    render();
  }

  function moveQuestion(id, dir) {
    var q = questions.filter(function (x) { return x.id === id; })[0];
    if (!q) return;
    var siblings = sectionQuestions(q.sectionId);
    var idx = siblings.findIndex(function (x) { return x.id === id; });
    var swapIdx = dir === 'up' ? idx - 1 : idx + 1;
    if (swapIdx < 0 || swapIdx >= siblings.length) return;
    var tmp = siblings[idx].order; siblings[idx].order = siblings[swapIdx].order; siblings[swapIdx].order = tmp;
    render();
  }

  function deleteQuestion(id) {
    window.TFC_MOCK.formQuestions[formId] = questions = questions.filter(function (q) { return q.id !== id; });
    syncQuestionCount();
    render();
  }

  function render() {
    var sorted = sections.slice().sort(function (a, b) { return a.order - b.order; });
    document.getElementById('frm-section-empty').hidden = sorted.length !== 0;
    document.getElementById('frm-section-list').innerHTML = sorted.map(function (sec, secIdx) {
      var qs = sectionQuestions(sec.id);
      var qRows = qs.map(function (q, qIdx) {
        return '<div class="qb-question-row" data-question-id="' + q.id + '">' +
          '<div class="qb-move-btns">' +
          '<button type="button" class="qb-move-btn" data-move-question-up' + (qIdx === 0 ? ' disabled' : '') + ' aria-label="ย้ายคำถามขึ้น">▲</button>' +
          '<button type="button" class="qb-move-btn" data-move-question-down' + (qIdx === qs.length - 1 ? ' disabled' : '') + ' aria-label="ย้ายคำถามลง">▼</button>' +
          '</div>' +
          '<div class="qb-question-info">' +
          '<div class="font-medium">' + (qIdx + 1) + '. ' + window.TFC.escapeHtml(q.text) + (q.required ? '<span class="form-required">*</span>' : '') + '</div>' +
          '<span class="badge badge-neutral mt-1">' + window.TFC.escapeHtml(q.type) + '</span>' +
          '</div>' +
          '<div class="table-row-actions">' +
          window.TFC.actionMenuTrigger([
            { key: 'edit-question', label: 'แก้ไขคำถาม', icon: 'edit', modal: 'question-create-modal', perm: 'evaluations' },
            { key: 'delete-question', label: 'ลบคำถาม', icon: 'delete', modal: 'frm-delete-confirm-modal', perm: 'evaluations', danger: true }
          ]) +
          '</div></div>';
      }).join('') || '<p class="small text-secondary">ยังไม่มีคำถามใน Section นี้</p>';

      return '<div class="card qb-section-card" data-section-id="' + sec.id + '">' +
        '<div class="flex items-start justify-between gap-2 mb-2">' +
        '<div class="flex items-start gap-2" style="flex:1;min-width:0;">' +
        '<div class="qb-move-btns" style="margin-top:6px;">' +
        '<button type="button" class="qb-move-btn" data-move-section-up' + (secIdx === 0 ? ' disabled' : '') + ' aria-label="ย้าย Section ขึ้น">▲</button>' +
        '<button type="button" class="qb-move-btn" data-move-section-down' + (secIdx === sorted.length - 1 ? ' disabled' : '') + ' aria-label="ย้าย Section ลง">▼</button>' +
        '</div>' +
        '<div style="flex:1;min-width:0;">' +
        '<input class="qb-section-title-input" data-section-title-input value="' + window.TFC.escapeHtml(sec.title) + '" placeholder="ชื่อ Section">' +
        '<input class="qb-section-desc-input" data-section-desc-input placeholder="คำอธิบาย Section (ถ้ามี)" value="' + window.TFC.escapeHtml(sec.description || '') + '">' +
        '</div></div>' +
        '<button type="button" class="btn btn-icon btn-sm" data-delete-section aria-label="ลบ Section">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>' +
        '</button>' +
        '</div>' +
        '<div class="flex flex-col gap-2 mb-2">' + qRows + '</div>' +
        '<button type="button" class="btn btn-outline btn-sm" data-add-question>' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> เพิ่มคำถามใน Section นี้' +
        '</button>' +
        '</div>';
    }).join('');
  }

  document.getElementById('frm-section-list').addEventListener('click', function (e) {
    var sectionCard = e.target.closest('.qb-section-card');
    if (!sectionCard) return;
    var sectionId = sectionCard.getAttribute('data-section-id');

    if (e.target.closest('[data-move-section-up]')) { moveSection(sectionId, 'up'); return; }
    if (e.target.closest('[data-move-section-down]')) { moveSection(sectionId, 'down'); return; }
    if (e.target.closest('[data-delete-section]')) {
      pendingDelete = { type: 'section', id: sectionId };
      document.getElementById('frm-delete-confirm-title').textContent = 'ยืนยันการลบ Section';
      document.getElementById('frm-delete-confirm-desc').textContent = 'คำถามทั้งหมดใน Section นี้จะถูกลบไปด้วย การดำเนินการนี้ไม่สามารถย้อนกลับได้';
      window.TFC.openModal('frm-delete-confirm-modal');
      return;
    }
    if (e.target.closest('[data-add-question]')) {
      addQuestionSectionId = sectionId;
      editingQuestionId = null;
      openQuestionModal();
      return;
    }
    var questionRow = e.target.closest('[data-question-id]');
    if (!questionRow) return;
    var questionId = questionRow.getAttribute('data-question-id');
    if (e.target.closest('[data-move-question-up]')) { moveQuestion(questionId, 'up'); return; }
    if (e.target.closest('[data-move-question-down]')) { moveQuestion(questionId, 'down'); return; }
    if (e.target.closest('.action-menu-btn')) { pendingQuestionId = questionId; }
  });

  document.getElementById('frm-section-list').addEventListener('input', function (e) {
    var sectionCard = e.target.closest('.qb-section-card');
    if (!sectionCard) return;
    var sec = sections.filter(function (s) { return s.id === sectionCard.getAttribute('data-section-id'); })[0];
    if (!sec) return;
    if (e.target.hasAttribute('data-section-title-input')) sec.title = e.target.value;
    if (e.target.hasAttribute('data-section-desc-input')) sec.description = e.target.value;
  });

  function toggleOptionsWrap() {
    document.getElementById('q-options-wrap').hidden = !TYPE_HAS_OPTIONS[document.getElementById('q-type').value];
  }
  document.getElementById('q-type').addEventListener('change', toggleOptionsWrap);

  function renderOptionsEditor() {
    document.getElementById('q-options-list').innerHTML = pendingOptions.map(function (opt, idx) {
      return '<div class="qb-option-row" data-option-index="' + idx + '">' +
        '<input class="input" data-option-text placeholder="ข้อความตัวเลือก" value="' + window.TFC.escapeHtml(opt.text) + '">' +
        '<input class="input" type="number" step="0.5" data-option-score placeholder="คะแนน" value="' + opt.score + '">' +
        '<button type="button" class="btn btn-icon btn-sm" data-remove-option aria-label="ลบตัวเลือก">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>' +
        '</div>';
    }).join('');
  }

  document.getElementById('q-add-option').addEventListener('click', function () {
    pendingOptions.push({ text: '', score: 0 });
    renderOptionsEditor();
  });
  document.getElementById('q-options-list').addEventListener('click', function (e) {
    var row = e.target.closest('[data-option-index]');
    if (row && e.target.closest('[data-remove-option]')) {
      pendingOptions.splice(Number(row.getAttribute('data-option-index')), 1);
      renderOptionsEditor();
    }
  });
  document.getElementById('q-options-list').addEventListener('input', function (e) {
    var row = e.target.closest('[data-option-index]');
    if (!row) return;
    var idx = Number(row.getAttribute('data-option-index'));
    if (e.target.hasAttribute('data-option-text')) pendingOptions[idx].text = e.target.value;
    if (e.target.hasAttribute('data-option-score')) pendingOptions[idx].score = parseFloat(e.target.value) || 0;
  });

  function openQuestionModal() {
    if (editingQuestionId) {
      var q = questions.filter(function (x) { return x.id === editingQuestionId; })[0];
      document.getElementById('frm-q-modal-title').textContent = 'แก้ไขคำถาม';
      document.getElementById('q-text').value = q.text;
      document.getElementById('q-type').value = q.type;
      document.getElementById('q-required').checked = q.required;
      pendingOptions = (q.options || []).map(function (o) { return { text: o.text, score: o.score }; });
    } else {
      document.getElementById('frm-q-modal-title').textContent = 'เพิ่มคำถาม';
      document.getElementById('q-text').value = '';
      document.getElementById('q-type').selectedIndex = 0;
      document.getElementById('q-required').checked = false;
      pendingOptions = [];
    }
    renderOptionsEditor();
    toggleOptionsWrap();
    window.TFC.openModal('question-create-modal');
  }

  document.addEventListener('click', function (e) {
    var item = e.target.closest('.dropdown-item[data-action-key]');
    if (!item) return;
    var key = item.getAttribute('data-action-key');
    if (key === 'edit-question' && pendingQuestionId !== null) {
      editingQuestionId = pendingQuestionId;
      openQuestionModal();
    }
    if (key === 'delete-question' && pendingQuestionId !== null) {
      pendingDelete = { type: 'question', id: pendingQuestionId };
      document.getElementById('frm-delete-confirm-title').textContent = 'ยืนยันการลบคำถาม';
      document.getElementById('frm-delete-confirm-desc').textContent = 'หากมีผู้ตอบแบบฟอร์มนี้ไปแล้ว คำตอบของคำถามนี้จะไม่แสดงในผลสรุป';
    }
  });

  document.getElementById('frm-q-save').addEventListener('click', function () {
    var text = document.getElementById('q-text').value.trim();
    if (!text) { window.TFC.showToast('กรุณาพิมพ์คำถาม', 'danger'); return; }
    var type = document.getElementById('q-type').value;
    var required = document.getElementById('q-required').checked;
    var options = [];
    if (TYPE_HAS_OPTIONS[type]) {
      options = pendingOptions.filter(function (o) { return o.text.trim(); }).map(function (o) { return { text: o.text.trim(), score: o.score }; });
      if (options.length < 2) { window.TFC.showToast('กรุณาเพิ่มตัวเลือกอย่างน้อย 2 ตัวเลือก', 'danger'); return; }
    }

    if (editingQuestionId) {
      var q = questions.filter(function (x) { return x.id === editingQuestionId; })[0];
      q.text = text; q.type = type; q.required = required; q.options = options;
    } else {
      questions.push({ id: newQuestionId(), sectionId: addQuestionSectionId, order: sectionQuestions(addQuestionSectionId).length + 1, text: text, type: type, required: required, options: options });
    }
    syncQuestionCount();
    render();
    window.TFC.closeModal('question-create-modal');
    window.TFC.showToast('บันทึกคำถามแล้ว', 'success');
  });

  document.getElementById('frm-delete-confirm-btn').addEventListener('click', function () {
    if (!pendingDelete) return;
    if (pendingDelete.type === 'section') {
      deleteSection(pendingDelete.id);
      window.TFC.showToast('ลบ Section แล้ว', 'success');
    } else if (pendingDelete.type === 'question') {
      deleteQuestion(pendingDelete.id);
      window.TFC.showToast('ลบคำถามแล้ว', 'success');
    }
    pendingDelete = null;
  });

  render();
})();
</script>
</body>
</html>
