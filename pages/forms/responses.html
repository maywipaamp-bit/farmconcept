      <button type="button" class="topbar-menu-btn" data-sidebar-open aria-label="เปิดเมนู">

      <div class="topbar-actions">
        <div class="dropdown">
          <button type="button" class="topbar-profile" data-dropdown-toggle aria-label="เมนูผู้ใช้งาน">
            <span class="avatar avatar-sm">สม<img src="../../assets/images/avatar-default.png" alt="" onerror="this.remove()"></span>

    <main class="content">
      <div class="page-header">
        <div class="page-header-text">
          <h1>คำตอบแบบฟอร์ม</h1>
          <p class="page-description" id="resp-form-name">-</p>
        </div>
        <div class="page-header-actions">
          <a href="#" class="btn btn-outline" id="resp-report-link">ดูผลสรุปทั้งหมด</a>
        </div>
      </div>

      <div class="page-toolbar">
        <div class="page-toolbar-search search-input">
          <span class="search-input-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span>

        </div>
      </div>

      <p class="small text-secondary mb-3">พบทั้งหมด <strong id="resp-result-count">0</strong> คำตอบ</p>

      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr><th>ชื่อผู้ตอบ</th><th>เบอร์โทร</th><th>วันที่ตอบ</th><th>คะแนน</th><th>การจัดการ</th></tr>
          </thead>
          <tbody id="resp-table-body"></tbody>
        </table>
      </div>

      <div class="state-block" id="resp-empty" hidden>
        <p class="state-title">ยังไม่มีผู้ตอบแบบฟอร์มนี้</p>
      </div>

<script src="../../assets/js/navigation.js"></script>
<script src="../../assets/js/modal.js"></script>
<script src="../../assets/js/action-menu.js"></script>
<script src="../../assets/js/toast.js"></script>
<script src="../../assets/js/form.js"></script>
<script src="../../assets/js/smart-select.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
(function () {
  var formId = new URLSearchParams(window.location.search).get('form');
  var form = (window.TFC_MOCK.forms || []).filter(function (f) { return f.id === formId; })[0];

  if (!form) {
    document.getElementById('resp-form-name').textContent = 'ไม่พบแบบฟอร์มที่ระบุ';
    document.getElementById('resp-report-link').hidden = true;
    return;
  }
  document.getElementById('resp-form-name').textContent = form.name;
  document.getElementById('resp-report-link').href = 'report.html?form=' + formId;

  var respondents = (window.TFC_MOCK.formResponses && window.TFC_MOCK.formResponses[formId]) || [];

  function render() {
    var q = (document.getElementById('resp-search').value || '').trim().toLowerCase();
    var filtered = respondents.filter(function (r) {
      if (!q) return true;
      return r.name.toLowerCase().indexOf(q) !== -1 || r.phone.indexOf(q) !== -1;
    });
    document.getElementById('resp-result-count').textContent = filtered.length;
    document.getElementById('resp-empty').hidden = filtered.length !== 0;
    document.querySelector('.table-wrapper').hidden = filtered.length === 0;
    document.getElementById('resp-table-body').innerHTML = filtered.map(function (r) {
      var scoreCell = (r.score === null || r.score === undefined) ? '<span class="text-secondary">-</span>' : '<span class="badge badge-success">' + r.score.toFixed(1) + ' / 5.0</span>';
      return '<tr>' +
        '<td>' + window.TFC.escapeHtml(r.name) + '</td>' +
        '<td>' + r.phone + '</td>' +
        '<td>' + window.TFC.formatThaiDate(r.submittedAt) + '</td>' +
        '<td>' + scoreCell + '</td>' +
        '<td class="table-row-actions">' +
        window.TFC.actionMenuTrigger([
          { key: 'view', label: 'ดูรายละเอียด', icon: 'view', href: 'report.html?form=' + formId },
          { key: 'export', label: 'Export', icon: 'export', perm: 'reports' }
        ]) +
        '</td></tr>';
    }).join('');
  }

  document.getElementById('resp-search').addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
