<script src="../../assets/js/data-service.js"></script>
<script src="../../assets/js/navigation.js"></script>
<script src="../../assets/js/modal.js"></script>

<script src="../../assets/js/index-layout.js"></script>
<script src="../../assets/js/toast.js"></script>
<script src="../../assets/js/form.js"></script>
<script src="../../assets/js/smart-select.js"></script>
<script src="../../assets/js/search-popover.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
(function () {
  var mock = window.TFC_MOCK || {};
  var tbody = document.getElementById('round-table-body');
  var removeIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>';

  window.TFC.renderPageHeader('round-page-header', {
    title: 'รอบติดตามกลุ่มตัวอย่าง'
  });

  function rowHtml(round) {
    round = round || {};
    return '<tr data-round-row data-id="' + (round.id || '') + '">' +
      '<td><input class="input" placeholder="เช่น ติดตามผล 3 เดือน" value="' + window.TFC.escapeHtml(round.name || '') + '" data-field="name"></td>' +
      '<td><input class="input" type="number" min="1" value="' + (round.trackDays != null ? round.trackDays : '') + '" data-field="trackDays"></td>' +
      '<td><label class="checkbox-item"><input type="checkbox" data-field="lineNotify"' + (round.lineNotify ? ' checked' : '') + '></label></td>' +
      '<td><input class="input" type="number" min="0" value="' + (round.notifyDaysBefore != null ? round.notifyDaysBefore : '') + '" data-field="notifyDaysBefore"></td>' +
      '<td><button type="button" class="dynamic-row-remove" data-remove-round aria-label="ลบแถว">' + removeIcon + '</button></td>' +
      '</tr>';
  }

  function renderRows(rounds) {
    tbody.innerHTML = (rounds.length ? rounds : [{}]).map(rowHtml).join('');
  }

  renderRows((mock.sampleFollowUpRounds || []).slice());

  document.getElementById('round-add-btn').addEventListener('click', function () {
    tbody.insertAdjacentHTML('beforeend', rowHtml({}));
  });

  tbody.addEventListener('click', function (e) {
    var removeBtn = e.target.closest('[data-remove-round]');
    if (!removeBtn) return;
    var row = removeBtn.closest('tr');
    if (row) row.remove();
    if (!tbody.children.length) tbody.insertAdjacentHTML('beforeend', rowHtml({}));
  });

  document.getElementById('round-form').addEventListener('submit', function () {
    var rows = Array.from(tbody.querySelectorAll('[data-round-row]'));
    var rounds = rows.map(function (row) {
      var name = row.querySelector('[data-field="name"]').value.trim();
      if (!name) return null;
      return {
        id: row.getAttribute('data-id') || ('ROUND-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 5).toUpperCase()),
        name: name,
        trackDays: parseInt(row.querySelector('[data-field="trackDays"]').value, 10) || 0,
        lineNotify: row.querySelector('[data-field="lineNotify"]').checked,
        notifyDaysBefore: parseInt(row.querySelector('[data-field="notifyDaysBefore"]').value, 10) || 0
      };
    }).filter(Boolean);

    window.TFC_MOCK.sampleFollowUpRounds = rounds;
    renderRows(rounds);
  });
})();
</script>
