<script>
(function () {
  var pageState = { page: 1, pageSize: 10 };
  var tgSvc = window.TFC.dataService('targetGroups');
  var mock = window.TFC_MOCK || {};

  window.TFC.renderPageHeader('target-group-page-header', {
    title: 'รายการกลุ่มเป้าหมาย',
    actions: [
      {
        label: 'เพิ่มกลุ่มเป้าหมาย',
        icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
        attrs: { id: 'tg-add-btn', 'data-open-modal': 'target-group-create-modal' }
      }
    ]
  });

  document.getElementById('tg-active').addEventListener('change', function () {
    document.getElementById('tg-active-label').textContent = this.checked ? 'ใช้งาน' : 'ไม่ใช้งาน';
  });

  function resetForm() {
    document.getElementById('tg-form-title').textContent = 'เพิ่มกลุ่มเป้าหมาย';
    document.getElementById('tg-form').reset();
    document.getElementById('tg-active').checked = true;
    document.getElementById('tg-active-label').textContent = 'ใช้งาน';
    document.getElementById('tg-form').setAttribute('data-editing-id', '');
  }
  document.getElementById('tg-add-btn').addEventListener('click', resetForm);

  document.addEventListener('click', function (e) {
    var trigger = e.target.closest('[data-action-key^="tg-edit-"]');
    if (!trigger) return;
    var id = trigger.getAttribute('data-action-key').replace('tg-edit-', '');
    var group = (mock.targetGroups || []).filter(function (g) { return g.id === id; })[0];
    if (!group) return;
    document.getElementById('tg-form-title').textContent = 'แก้ไขกลุ่มเป้าหมาย';
    document.getElementById('tg-name').value = group.name || '';
    document.getElementById('tg-active').checked = group.active !== false;
    document.getElementById('tg-active-label').textContent = group.active !== false ? 'ใช้งาน' : 'ไม่ใช้งาน';
    document.getElementById('tg-form').setAttribute('data-editing-id', group.id);
  });

  function renderTable() {
    tgSvc.list().then(function (groups) {
      var keyword = ((document.getElementById('target-group-search') || {}).value || '').trim().toLowerCase();
      var filtered = groups.filter(function (g) {
        return !keyword || g.name.toLowerCase().indexOf(keyword) !== -1;
      });

      var pageCount = Math.max(1, Math.ceil(filtered.length / pageState.pageSize));
      if (pageState.page > pageCount) pageState.page = pageCount;
      var start = (pageState.page - 1) * pageState.pageSize;
      var pageRows = filtered.slice(start, start + pageState.pageSize);

      document.getElementById('target-group-table-body').innerHTML = pageRows.map(function (g, i) {
        return '<tr>' +
          '<td class="col-no nowrap">' + (start + i + 1) + '</td>' +
          '<td>' + window.TFC.escapeHtml(g.name) + '</td>' +
          '<td>' + g.memberCount + '</td>' +
          '<td><div class="cell-updated-by">' + window.TFC.escapeHtml(g.updatedBy || '-') + '</div>' +
          '<div class="cell-updated-at">' + (g.updatedAt ? window.TFC.formatThaiDate(g.updatedAt) : '-') + '</div></td>' +
          '<td class="nowrap">' + window.TFC.statusSelectHTML({ options: mock.masterActiveStatuses, value: g.active === false ? 'ไม่ใช้งาน' : 'ใช้งาน', rowId: g.id, ariaLabel: 'สถานะของ ' + g.name }) + '</td>' +
          '<td class="table-row-actions">' +
          window.TFC.actionMenuTrigger([
            { key: 'tg-edit-' + g.id, label: 'แก้ไข', icon: 'edit', modal: 'target-group-create-modal', perm: 'master_data' },
            { key: 'delete', label: 'ลบกลุ่มเป้าหมาย', icon: 'delete', modal: 'target-group-delete-modal', perm: 'master_data', danger: true }
          ]) +
          '</td></tr>';
      }).join('');

      window.TFC.renderPagination('target-group-pagination', {
        page: pageState.page,
        pageSize: pageState.pageSize,
        total: filtered.length,
        pageSizeOptions: [10, 20, 50],
        footer: true,
        onChange: function (p) { pageState.page = p; renderTable(); },
        onPageSizeChange: function (size) { pageState.pageSize = size; pageState.page = 1; renderTable(); }
      });
    });
  }

  /* แถบค้นหา/ตัวกรองย้ายเข้า Search Panel Popover — ใช้ id เดิมเพื่อให้ renderTable() อ่านค่าได้เหมือนเดิม */
  window.TFC.attachListToolbar({
    chipId: 'target-group-filter-chip',
    chipLabelId: 'target-group-filter-chip-label',
    popoverId: 'target-group-search-popover',
    search: { id: 'target-group-search', placeholder: 'ค้นหาชื่อกลุ่มเป้าหมาย' },
    onApply: function (values, done) {
      pageState.page = 1;
      renderTable();
      done();
    }
  });

  document.getElementById('target-group-export').addEventListener('click', function () {
    window.TFC.exportTableCsv('#target-group-table-body', 'กลุ่มเป้าหมาย.csv');
  });

  document.getElementById('tg-form').addEventListener('submit', function () {
    var editingId = this.getAttribute('data-editing-id');
    var payload = {
      name: document.getElementById('tg-name').value,
      active: document.getElementById('tg-active').checked,
      updatedBy: (mock.currentUser || {}).name || ''
    };
    var save = editingId ? tgSvc.update(editingId, payload) : tgSvc.create(Object.assign({ ageRange: '', memberCount: 0, avgScoreChange: 0 }, payload));
    save.then(renderTable);
  });

  renderTable();
})();
</script>
