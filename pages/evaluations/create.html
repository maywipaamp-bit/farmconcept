  <div class="app-main">
    <header class="topbar">
      <button type="button" class="topbar-menu-btn" data-sidebar-open aria-label="เปิดเมนู">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>

      <div class="topbar-breadcrumb">
        <nav class="breadcrumb" aria-label="Breadcrumb">

          <a href="list.html">รายการแบบประเมิน</a> <span>/</span>
          <span class="is-current">สร้างแบบประเมิน</span>
        </nav>
      </div>

      <div class="topbar-actions">
        <div class="dropdown">
          <button type="button" class="topbar-profile" data-dropdown-toggle aria-label="เมนูผู้ใช้งาน">
            <span class="avatar avatar-sm">สม</span>
            <span class="topbar-profile-info hidden-mobile">
              <span class="topbar-profile-name">สุนิสา แก้วมณี</span>

          </button>

            <a class="dropdown-item" href="../profile.html">โปรไฟล์ของฉัน</a>

    </header>

    <main class="content">
      <div class="page-header">
        <div class="page-header-text">
          <h1>สร้างแบบประเมิน</h1>
          <p class="page-description">กำหนดข้อมูลพื้นฐานของแบบประเมิน จากนั้นจึงเพิ่มคำถามในขั้นตอนถัดไป</p>
        </div>
      </div>

      <form data-mock-submit="สร้างแบบประเมินสำเร็จ ไปยังหน้าจัดการคำถาม" data-mock-redirect="questions.html">
        <div class="card mb-5">
          <h2 class="card-title">ข้อมูลแบบประเมิน</h2>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="ev-name">ชื่อแบบประเมิน<span class="form-required">*</span></label>
              <input class="input" id="ev-name" placeholder="เช่น แบบประเมินหลังเข้าร่วม: ปลูกผักปลอดสาร" data-validate required>
            </div>
            <div class="form-group">
              <label class="form-label" for="ev-type">ประเภทแบบประเมิน<span class="form-required">*</span></label>
              <select class="select" id="ev-type" required>
                <option value="">เลือกประเภท</option>
                <option>หลังเข้าร่วมกิจกรรม</option>
                <option>ติดตามผล 3 เดือน</option>
                <option>ติดตามผล 6 เดือน</option>
                <option>ติดตามผล 12 เดือน</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="ev-activity">กิจกรรมที่เกี่ยวข้อง</label>
              <select class="select" id="ev-activity">
                <option>ปลูกผักปลอดสารสำหรับครอบครัว</option>
                <option>Workshop อาหารสุขภาพจากสวน</option>
                <option>เรียนรู้การทำปุ๋ยหมัก</option>
                <option>กิจกรรมฟื้นฟูสุขภาวะชุมชน</option>
              </select>
            </div>
          </div>
          <div class="form-group mb-0">
            <label class="form-label" for="ev-desc">คำอธิบาย</label>
            <textarea class="textarea" id="ev-desc" placeholder="คำชี้แจงที่จะแสดงให้ผู้ตอบเห็นก่อนเริ่มทำแบบประเมิน"></textarea>
          </div>
        </div>

        <div class="form-action-bar">
          <button type="button" class="btn btn-outline" data-go-back>ยกเลิก</button>
          <button type="submit" class="btn btn-primary">บันทึกและเพิ่มคำถาม</button>
        </div>
      </form>
    </main>
  </div>
