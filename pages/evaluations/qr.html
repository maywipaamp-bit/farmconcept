<!DOCTYPE html>
<html lang="th" class="is-preload">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/utilities.css">
<link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body>

<div class="app-shell">
<script>(function(){try{if(localStorage.getItem('tfc-sidebar-collapsed')==='1'){document.currentScript.parentElement.classList.add('is-sidebar-collapsed');}}catch(e){}})();</script>
  <div class="sidebar-overlay"></div>

  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="../../index.html" class="sidebar-brand">
        <img class="sidebar-logo" src="../../assets/images/logo-farm.jpg" alt="The Farm Concept">
      </a>
      <button type="button" class="sidebar-toggle" data-sidebar-collapse-toggle aria-label="ย่อ/ขยายเมนู">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav" aria-label="เมนูหลัก" data-nav-base="../../"></nav>
  </aside>

  <script src="../../assets/js/mock-data.js"></script>
  <script src="../../assets/js/menu-config.js"></script>
  <script src="../../assets/js/sidebar-render.js"></script>

  <div class="app-main">
    <header class="topbar">
      <button type="button" class="topbar-menu-btn" data-sidebar-open aria-label="เปิดเมนู">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>

      <div class="topbar-breadcrumb">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="../../dashboard.html">แดชบอร์ด</a> <span>/</span>
          <a href="list.html">รายการแบบประเมิน</a> <span>/</span>
          <span class="is-current">QR แบบประเมิน</span>
        </nav>
      </div>

      <div class="topbar-actions">
        <div class="dropdown">
          <button type="button" class="topbar-profile" data-dropdown-toggle aria-label="เมนูผู้ใช้งาน">
            <span class="avatar avatar-sm">สม<img src="../../assets/images/avatar-default.png" alt="" onerror="this.remove()"></span>
            <span class="topbar-profile-info hidden-mobile">
              <span class="topbar-profile-name">สุนิสา แก้วมณี</span>
              <span class="topbar-profile-role">เจ้าหน้าที่โครงการ</span>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="dropdown-menu">
            <a class="dropdown-item" href="../profile.html">โปรไฟล์ของฉัน</a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item is-danger" href="../../login.html">ออกจากระบบ</a>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="page-header">
        <div class="page-header-text">
          <h1>QR แบบประเมิน</h1>
          <p class="page-description">แบบประเมินหลังเข้าร่วม: ปลูกผักปลอดสารสำหรับครอบครัว</p>
        </div>
      </div>

      <div class="card card-centered-sm">
        <div class="text-center">
          <div class="slip-thumbnail-lg mb-4">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM21 14h.01M17 21h.01M21 21h.01M14 21h.01"/></svg>
            <span class="small">QR Code สำหรับแบบประเมินนี้ (ตัวอย่าง Placeholder)</span>
          </div>
          <p class="small text-secondary mb-3">ให้ผู้เข้าร่วมสแกน QR นี้เพื่อเปิดแบบประเมินบนมือถือได้ทันที</p>

          <div class="form-group">
            <label class="form-label" for="qr-link">ลิงก์แบบประเมิน</label>
            <div class="input-with-icon">
              <input class="input" id="qr-link" value="https://thefarmconcept.org/e/EVL-001" readonly>
            </div>
          </div>

          <div class="flex items-center justify-center gap-3 flex-wrap">
            <button type="button" class="btn btn-outline" id="qr-copy-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
              คัดลอกลิงก์
            </button>
            <button type="button" class="btn btn-outline" id="qr-download-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>
              ดาวน์โหลด QR
            </button>
            <button type="button" class="btn btn-primary" id="qr-print-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
              พิมพ์
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../../assets/js/data-service.js"></script>
<script src="../../assets/js/navigation.js"></script>
<script src="../../assets/js/modal.js"></script>
<script src="../../assets/js/action-menu.js"></script>
<script src="../../assets/js/toast.js"></script>
<script src="../../assets/js/form.js"></script>
<script src="../../assets/js/smart-select.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
(function () {
  document.getElementById('qr-copy-btn').addEventListener('click', function () {
    var input = document.getElementById('qr-link');
    input.select();
    if (navigator.clipboard) {
      navigator.clipboard.writeText(input.value).catch(function () {});
    }
    window.TFC.showToast('คัดลอกลิงก์แบบประเมินแล้ว', 'success');
  });

  document.getElementById('qr-download-btn').addEventListener('click', function () {
    window.TFC.showToast('ฟีเจอร์ดาวน์โหลด QR จะเชื่อมต่อจริงในระยะพัฒนา Backend', 'info');
  });

  document.getElementById('qr-print-btn').addEventListener('click', function () {
    window.TFC.showToast('ฟีเจอร์พิมพ์จะเชื่อมต่อจริงในระยะพัฒนา Backend', 'info');
  });
})();
</script>
</body>
</html>
