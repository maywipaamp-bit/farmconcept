<script>
(function () {
  var statusBadge = { 'รอดำเนินการ': 'badge-info', 'เกินกำหนด': 'badge-danger', 'เสร็จสิ้น': 'badge-success' };
  var followUps = (window.TFC_MOCK ? window.TFC_MOCK.followUps : []);
  var tbody = document.getElementById('followup-table-body');

  function render(list) {
    tbody.innerHTML = list.map(function (f, index) {
      var isDone = f.status === 'เสร็จสิ้น';
      return '<tr>' +
        '<td>' + window.TFC.escapeHtml(f.name) + '</td>' +
        '<td>' + window.TFC.escapeHtml(f.activityName) + '</td>' +
        '<td>' + f.period + '</td>' +
        '<td>' + window.TFC.formatThaiDate(f.dueDate) + '</td>' +
        '<td><span class="badge ' + (statusBadge[f.status] || 'badge-neutral') + '">' + f.status + '</span></td>' +
        '<td class="table-row-actions">' +
        (isDone
          ? '<button type="button" class="btn btn-outline btn-sm" disabled>เสร็จสิ้นแล้ว</button>'
          : '<button type="button" class="btn btn-primary btn-sm" data-followup-index="' + index + '">ส่งลิงก์แบบติดตามผล</button>') +
        window.TFC.actionMenuTrigger([
          { key: 'individual', label: 'รายงานรายบุคคล', icon: 'report', href: '../reports/individual.html', perm: 'reports' },
          { key: 'export', label: 'Export', icon: 'export', perm: 'reports' }
        ]) +
        '</td></tr>';
    }).join('');
  }

  render(followUps);

  tbody.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-followup-index]');
    if (!btn) return;
    var index = Number(btn.getAttribute('data-followup-index'));
    if (window.TFC && window.TFC.showToast) {
      window.TFC.showToast('ส่งลิงก์แบบติดตามผลให้ ' + followUps[index].name + ' แล้ว', 'success');
    }
  });
})();
</script>
