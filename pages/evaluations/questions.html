</head>
<body>

<div class="app-shell">
<script>(function(){try{if(localStorage.getItem('tfc-sidebar-collapsed')==='1'){document.currentScript.parentElement.classList.add('is-sidebar-collapsed');}}catch(e){}})();</script>
  <div class="sidebar-overlay"></div>

  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="../../index.html" class="sidebar-brand">
        <img class="sidebar-logo" src="../../assets/images/logo-mark.png" alt=""><span class="sidebar-title"><img src="../../assets/images/logo-farm.jpg" alt="The Farm Concept"></span>
      </a>
      <button type="button" class="sidebar-toggle" data-sidebar-collapse-toggle aria-label="ย่อ/ขยายเมนู">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav" aria-label="เมนูหลัก" data-nav-base="../../"></nav>
  </aside>

  <script src="../../assets/js/mock-data.js"></script>
  <script src="../../assets/js/menu-config.js"></script>
  <script src="../../assets/js/sidebar-render.js"></script>

  <div class="app-main">
    <header class="topbar">
      <button type="button" class="topbar-menu-btn" data-sidebar-open aria-label="เปิดเมนู">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>

      <div class="topbar-breadcrumb">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="../../dashboard.html">แดชบอร์ด</a> <span>/</span>
          <a href="list.html">รายการแบบประเมิน</a> <span>/</span>
          <span class="is-current">จัดการคำถาม</span>
        </nav>
      </div>

      <div class="topbar-actions">
        <div class="dropdown">
          <button type="button" class="topbar-profile" data-dropdown-toggle aria-label="เมนูผู้ใช้งาน">
            <span class="avatar avatar-sm">สม<img src="../../assets/images/avatar-default.jpg" alt="" onerror="this.remove()"></span>
            <span class="topbar-profile-info hidden-mobile">
              <span class="topbar-profile-name">สุนิสา แก้วมณี</span>
              <span class="topbar-profile-role">เจ้าหน้าที่โครงการ</span>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="dropdown-menu">
            <a class="dropdown-item" href="../profile.html">โปรไฟล์ของฉัน</a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item is-danger" href="../../login.html">ออกจากระบบ</a>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="page-header">
        <div class="page-header-text">
          <h1>จัดการคำถาม</h1>
          <p class="page-description">แบบประเมินหลังเข้าร่วม: ปลูกผักปลอดสารสำหรับครอบครัว</p>
        </div>
        <div class="page-header-actions">
          <a href="qr.html" class="btn btn-outline">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            QR แบบประเมิน
          </a>
          <button type="button" class="btn btn-primary" data-open-modal="question-create-modal">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            เพิ่มคำถาม
          </button>
        </div>
      </div>

      <div class="flex flex-col gap-3" id="question-list"></div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="question-create-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">เพิ่มคำถาม</h3>
      <button type="button" class="modal-close" data-close-modal aria-label="ปิดหน้าต่าง">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <form data-mock-submit="เพิ่มคำถามสำเร็จ (ตัวอย่าง)">
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="q-text">คำถาม<span class="form-required">*</span></label>
          <input class="input" id="q-text" placeholder="พิมพ์คำถามที่ต้องการ" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="q-type">ประเภทคำตอบ</label>
          <select class="select" id="q-type">
            <option>คะแนนความพึงพอใจ (1-5)</option>
            <option>ตัวเลือกเดียว</option>
            <option>ตัวเลือกหลายข้อ</option>
            <option>ข้อความสั้น</option>
            <option>ข้อความยาว</option>
          </select>
        </div>
        <div class="form-group mb-0">
          <label class="checkbox-item">
            <input type="checkbox" id="q-required">
            <span class="small">บังคับตอบคำถามนี้</span>
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-close-modal>ยกเลิก</button>
        <button type="submit" class="btn btn-primary">บันทึก</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="question-delete-modal">
  <div class="modal modal-sm">
    <div class="modal-body text-center">
      <span class="modal-confirm-icon is-danger mx-auto">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
      </span>
      <h3 class="modal-title mb-3">ยืนยันการลบคำถาม</h3>
      <p class="text-secondary">หากมีผู้ตอบแบบประเมินนี้ไปแล้ว คำตอบของคำถามนี้จะไม่แสดงในผลสรุป</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close-modal>ยกเลิก</button>
      <button class="btn btn-danger" data-close-modal>ลบคำถาม</button>
    </div>
  </div>
</div>

<script src="../../assets/js/data-service.js"></script>
<script src="../../assets/js/navigation.js"></script>
<script src="../../assets/js/modal.js"></script>
<script src="../../assets/js/action-menu.js"></script>
<script src="../../assets/js/toast.js"></script>
<script src="../../assets/js/form.js"></script>
<script src="../../assets/js/smart-select.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
(function () {
  var questions = (window.TFC_MOCK && window.TFC_MOCK.evaluationQuestions['EVL-001']) || [];
  document.getElementById('question-list').innerHTML = questions.map(function (q) {
    return '<div class="card">' +
      '<div class="flex items-center justify-between gap-3">' +
      '<div class="flex items-center gap-3">' +
      '<span class="step-circle">' + q.order + '</span>' +
      '<div>' +
      '<div class="font-medium">' + window.TFC.escapeHtml(q.text) + (q.required ? '<span class="form-required">*</span>' : '') + '</div>' +
      '<span class="badge badge-neutral mt-1">' + window.TFC.escapeHtml(q.type) + '</span>' +
      '</div></div>' +
      '<div class="table-row-actions">' +
      window.TFC.actionMenuTrigger([
        { key: 'edit', label: 'แก้ไขคำถาม', icon: 'edit', modal: 'question-create-modal', perm: 'evaluations' },
        { key: 'delete', label: 'ลบคำถาม', icon: 'delete', modal: 'question-delete-modal', perm: 'evaluations', danger: true }
      ]) +
      '</div></div></div>';
  }).join('');
})();
</script>
</body>
</html>
