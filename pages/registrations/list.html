<script src="../../assets/js/app.js"></script>
<script>
(function () {
  var paymentBadge = { 'ชำระแล้ว': 'badge-success', 'รอตรวจสอบ': 'badge-warning', 'ปฏิเสธ': 'badge-danger' };
  var checkinBadge = { 'เข้าร่วมแล้ว': 'badge-success', 'ยังไม่เข้าร่วม': 'badge-neutral' };
  var registrations = (window.TFC_MOCK ? window.TFC_MOCK.registrations : []);
  var activityNames = registrations.map(function (r) { return r.activityName; }).filter(function (n, i, arr) { return arr.indexOf(n) === i; });

  window.TFC.renderPageHeader('reg-page-header', {
    title: 'ผู้ลงทะเบียน',
    description: 'รายชื่อผู้ลงทะเบียนกิจกรรมทั้งหมด พร้อมสถานะการชำระเงินและการเข้าร่วม'
  });

  var paidCount = registrations.filter(function (r) { return r.paymentStatus === 'ชำระแล้ว'; }).length;
  var pendingCount = registrations.filter(function (r) { return r.paymentStatus === 'รอตรวจสอบ'; }).length;
  var checkedInCount = registrations.filter(function (r) { return r.checkinStatus === 'เข้าร่วมแล้ว'; }).length;

  window.TFC.renderStatCards('reg-stat-cards', [
    {
      icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>',
      label: 'ผู้เข้าร่วมทั้งหมด',
      value: registrations.length
    },
    {
      icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>',
      tone: 'success',
      label: 'ชำระเงินแล้ว',
      value: paidCount,
      target: registrations.length
    },
    {
      icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
      tone: 'warning',
      label: 'รอตรวจสอบการชำระเงิน',
      value: pendingCount
    },
    {
      icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>',
      tone: 'info',
      label: 'Check-in แล้ว',
      value: checkedInCount,
      target: registrations.length
    }
  ]);

  window.TFC.renderFilterRow('reg-filter-row', {
    resultCountId: 'reg-result-count',
    resultCount: registrations.length,
    filters: [
      {
        id: 'reg-filter-activity',
        placeholder: 'กิจกรรมทั้งหมด',
        options: activityNames.map(function (n) { return { label: n }; })
      },
      {
        id: 'reg-filter-payment',
        placeholder: 'สถานะการชำระเงินทั้งหมด',
        options: [
          { label: 'ชำระแล้ว' },
          { label: 'รอตรวจสอบ' },
          { label: 'ปฏิเสธ' }
        ]
      }
    ],
    search: { placeholder: 'ค้นหาชื่อหรือเบอร์โทร...' }
  });

  document.getElementById('reg-table-body').innerHTML = registrations.map(function (r) {
    return '<tr>' +
      '<td>' + r.id + '</td>' +
      '<td>' + window.TFC.escapeHtml(r.name) + '</td>' +
      '<td>' + r.phone + '</td>' +
      '<td>' + window.TFC.escapeHtml(r.activityName) + '</td>' +
      '<td>' + window.TFC.escapeHtml(r.session) + '</td>' +
      '<td><span class="badge ' + (paymentBadge[r.paymentStatus] || 'badge-neutral') + '">' + r.paymentStatus + '</span></td>' +
      '<td><span class="badge ' + (checkinBadge[r.checkinStatus] || 'badge-neutral') + '">' + r.checkinStatus + '</span></td>' +
      '<td class="table-row-actions">' +
      window.TFC.actionMenuTrigger([
        { key: 'checkin', label: 'Check-in', icon: 'checkin', href: '../checkin/index.html', perm: 'activities' },
        { key: 'payment', label: 'ตรวจสอบการชำระเงิน', icon: 'payment', href: 'payments.html', perm: 'payments' },
        { key: 'cancel', label: 'ยกเลิกการลงทะเบียน', icon: 'delete', modal: 'reg-cancel-modal', perm: 'activities', danger: true }
      ]) +
      '</td></tr>';
  }).join('');

  document.getElementById('reg-result-count').textContent = registrations.length;
})();
</script>
</body>
</html>
