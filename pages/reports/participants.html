<script>
(function () {
  var statusBadge = {
    'ติดตามตามกำหนด': 'badge-success',
    'เกินกำหนดติดตามผล': 'badge-danger',
    'ติดตามครบแล้ว': 'badge-info',
    'ยังไม่เข้าร่วมกิจกรรม': 'badge-neutral'
  };
  var participants = (window.TFC_MOCK ? window.TFC_MOCK.participantsSummary : []);
  var areas = participants.map(function (p) { return p.area; }).filter(function (a, i, arr) { return arr.indexOf(a) === i; });

  window.TFC.renderPageHeader('rp-page-header', {
    title: 'รายงานผู้เข้าร่วม',
    description: 'สรุปข้อมูลผู้เข้าร่วมกิจกรรม ความพึงพอใจ และสถานะการติดตามผล',
    actions: [
      {
        label: 'ส่งออก Excel',
        variant: 'outline',
        icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>'
      }
    ]
  });

  window.TFC.renderFilterRow('rp-filter-row', {
    filters: [
      {
        id: 'rp-participant-area-filter',
        placeholder: 'พื้นที่ทั้งหมด',
        options: areas.map(function (a) { return { label: a }; })
      }
    ],
    search: { placeholder: 'ค้นหาชื่อผู้เข้าร่วม...' }
  });

  var pendingCount = participants.filter(function (p) {
    return p.followUpStatus === 'เกินกำหนดติดตามผล' || p.followUpStatus === 'ติดตามตามกำหนด';
  }).length;

  window.TFC.renderStatCards('rp-stat-cards', [
    {
      icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/></svg>',
      label: 'ผู้เข้าร่วมในรายงานนี้',
      value: participants.length
    },
    {
      icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
      tone: 'warning',
      label: 'รอติดตามผล/เกินกำหนด',
      value: pendingCount
    }
  ]);

  document.getElementById('rp-participants-body').innerHTML = participants.map(function (p) {
    return '<tr>' +
      '<td>' + window.TFC.escapeHtml(p.name) + '</td>' +
      '<td>' + window.TFC.escapeHtml(p.area) + '</td>' +
      '<td>' + window.TFC.escapeHtml(p.targetGroup) + '</td>' +
      '<td>' + p.activitiesJoined + '</td>' +
      '<td>' + (p.avgSatisfaction > 0 ? p.avgSatisfaction.toFixed(1) + ' / 5.0' : '-') + '</td>' +
      '<td><span class="badge ' + (statusBadge[p.followUpStatus] || 'badge-neutral') + '">' + p.followUpStatus + '</span></td>' +
      '</tr>';
  }).join('');
})();
</script>
