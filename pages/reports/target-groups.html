<script>
(function () {
  var groups = (window.TFC_MOCK ? window.TFC_MOCK.targetGroups : []);

  document.getElementById('rp-tg-body').innerHTML = groups.map(function (g) {
    return '<tr>' +
      '<td>' + window.TFC.escapeHtml(g.name) + '</td>' +
      '<td>' + window.TFC.escapeHtml(g.ageRange) + '</td>' +
      '<td>' + g.memberCount + '</td>' +
      '<td><span class="badge badge-success">+' + g.avgScoreChange.toFixed(1) + '</span></td>' +
      '</tr>';
  }).join('');

  var totalMembers = groups.reduce(function (sum, g) { return sum + g.memberCount; }, 0);
  document.getElementById('rp-tg-count').textContent = groups.length;
  document.getElementById('rp-tg-members').textContent = totalMembers;
})();
</script>
