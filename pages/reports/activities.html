<script>
(function () {
  var statusBadgeMap = { 'เปิดรับสมัคร': 'badge-success', 'เต็มแล้ว': 'badge-neutral', 'ฉบับร่าง': 'badge-info', 'ดำเนินการเสร็จสิ้น': 'badge-neutral' };
  var activities = (window.TFC_MOCK ? window.TFC_MOCK.activities : []);

  document.getElementById('rp-activities-body').innerHTML = activities.map(function (a) {
    var fillRate = Math.round((a.registered / a.capacity) * 100);
    return '<tr>' +
      '<td>' + a.id + '</td>' +
      '<td>' + window.TFC.escapeHtml(a.name) + '</td>' +
      '<td>' + window.TFC.escapeHtml(a.program) + '</td>' +
      '<td>' + window.TFC.escapeHtml(a.area) + '</td>' +
      '<td>' + a.registered + '/' + a.capacity + '</td>' +
      '<td>' + fillRate + '%</td>' +
      '<td><span class="badge ' + (statusBadgeMap[a.status] || 'badge-neutral') + '">' + a.status + '</span></td>' +
      '</tr>';
  }).join('');

  var totalCapacity = activities.reduce(function (sum, a) { return sum + a.capacity; }, 0);
  var totalRegistered = activities.reduce(function (sum, a) { return sum + a.registered; }, 0);
  document.getElementById('rp-total-activities').textContent = activities.length;
  document.getElementById('rp-total-capacity').textContent = totalCapacity;
  document.getElementById('rp-total-registered').textContent = totalRegistered;
  document.getElementById('rp-fill-rate').textContent = Math.round((totalRegistered / totalCapacity) * 100) + '%';
})();
</script>
