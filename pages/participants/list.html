<script>(function(){try{if(localStorage.getItem('tfc-sidebar-collapsed')==='1'){document.currentScript.parentElement.classList.add('is-sidebar-collapsed');}}catch(e){}})();</script>
  <div class="sidebar-overlay"></div>

  <aside class="sidebar">

      </a>
      <button type="button" class="sidebar-toggle" data-sidebar-collapse-toggle aria-label="ย่อ/ขยายเมนู">

    </div>

    <nav class="sidebar-nav" id="sidebar-nav" aria-label="เมนูหลัก" data-nav-base="../../"></nav>

      <div class="topbar-actions">
        <div class="dropdown">
          <button type="button" class="topbar-profile" data-dropdown-toggle aria-label="เมนูผู้ใช้งาน">
            <span class="avatar avatar-sm">สม<img src="../../assets/images/avatar-default.png" alt="" onerror="this.remove()"></span>

      <div class="page-header" id="participant-page-header"></div>

      <div class="page-toolbar" id="participant-filter-row"></div>

      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width:64px;">ลำดับ</th>
              <th>ชื่อผู้เข้าร่วม</th>
              <th>แหล่งที่มา</th>

              <th>จำนวนกิจกรรม</th>
              <th>จำนวนทำแบบประเมิน</th>
              <th>จำนวนทำแบบประเมินเปลี่ยนแปลง</th>
              <th>จำนวนการซื้อสินค้า</th>
              <th>กลุ่มเป้าหมาย</th>
              <th style="width:80px;">จัดการ</th>

</div>

<div class="modal-overlay" id="participant-delete-modal">
  <div class="modal modal-sm">
    <div class="modal-body text-center">
      <span class="modal-confirm-icon is-danger mx-auto">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
      </span>
      <h3 class="modal-title mb-3">ยืนยันการลบผู้เข้าร่วม</h3>
      <p class="text-secondary" id="participant-delete-message">ประวัติกิจกรรม แบบประเมิน และการซื้อสินค้าของผู้เข้าร่วมรายนี้จะถูกลบไปด้วย</p>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline" data-close-modal>ยกเลิก</button>
      <button type="button" class="btn btn-danger" id="participant-delete-confirm">ลบผู้เข้าร่วม</button>
    </div>
  </div>
</div>

<script src="../../assets/js/data-service.js"></script>
<script src="../../assets/js/navigation.js"></script>
<script src="../../assets/js/modal.js"></script>
<script src="../../assets/js/action-menu.js"></script>
<script src="../../assets/js/index-layout.js"></script>
<script src="../../assets/js/participants.js"></script>
<script src="../../assets/js/toast.js"></script>
<script src="../../assets/js/form.js"></script>
<script src="../../assets/js/smart-select.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
(function () {
  var P = window.TFC.participants;
  var mock = window.TFC_MOCK || {};
  var svc = P.service();
  var tbody = document.getElementById('participant-table-body');
  var pendingDeleteId = '';

  /* A. Page Header — ปุ่มเพิ่มเป็น <a> ไปหน้าฟอร์มเต็มจอ (form.html) ไม่ใช่ Popup
     โมดูลนี้เป็นข้อยกเว้นเดียวของระบบที่ใช้ฟอร์มเต็มจอ เพราะฟอร์มมี 4 Section + Section แผนการติดตาม
     ที่ render ตามจำนวนรอบแบบ Dynamic ซึ่งยาวเกินกว่าจะใส่ใน Modal ได้อย่างใช้งานสะดวก
     Popup Pattern ของโมดูลอื่นคงไว้เหมือนเดิมทุกประการ */
  window.TFC.renderPageHeader('participant-page-header', {
    title: 'ผู้เข้าร่วมทั้งหมด',
    description: 'ข้อมูลผู้เข้าร่วมโครงการทั้งกลุ่มตัวอย่างและผู้เข้าร่วมทั่วไป พร้อมสรุปจำนวนกิจกรรม แบบประเมิน และการซื้อสินค้า',
    actions: [
      {
        label: 'เพิ่มผู้เข้าร่วม',
        icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
        href: 'form.html'
      }
    ]
  });

  /* C. Filter Row — ค้นหาชื่อ/เบอร์/อีเมล + กรองประเภท / กลุ่มเป้าหมาย / แหล่งที่มาข้อมูล
     ตัวเลือกกลุ่มเป้าหมายและแหล่งที่มาดึงจาก Mock Data ชุดเดียวกับโมดูล "พื้นฐาน" */
  window.TFC.renderFilterRow('participant-filter-row', {
    resultCountId: 'participant-result-count',
    resultCount: P.all().length,
    resultLabelSuffix: 'คน',
    filters: [
      { id: 'participant-filter-type', placeholder: 'ประเภททั้งหมด', options: mock.participantTypes || [] },
      { id: 'participant-filter-target-group', placeholder: 'กลุ่มเป้าหมายทั้งหมด', options: P.targetGroupNames().map(function (name) { return { label: name }; }) },
      { id: 'participant-filter-source', placeholder: 'แหล่งที่มาทั้งหมด', options: P.dataSources().map(function (name) { return { label: name }; }) }
    ],
    search: { id: 'participant-search', placeholder: 'ค้นหาชื่อผู้เข้าร่วม / เบอร์โทร / อีเมล...' }
  });

  function matchesKeyword(participant, keyword) {
    if (!keyword) return true;
    return [participant.name, participant.phone, participant.email].some(function (field) {
      return String(field || '').toLowerCase().indexOf(keyword) !== -1;
    });
  }

  function rowHtml(participant, index) {
    var counts = P.counts(participant.id);
    var contactValue = participant.contactChannel === 'อีเมล' ? participant.email : participant.phone;

    return '<tr>' +
      '<td>' + (index + 1) + '</td>' +
      '<td><div class="font-medium">' + window.TFC.escapeHtml(participant.name) + '</div>' +
      '<div class="caption text-secondary">' + window.TFC.escapeHtml(participant.personCode || '-') + ' · ' + P.typeLabel(participant.type) + '</div></td>' +
      '<td>' + window.TFC.escapeHtml(participant.source || '-') + '</td>' +
      '<td><div class="small">' + window.TFC.escapeHtml(participant.contactChannel || '-') + '</div>' +
      '<div class="caption text-secondary">' + window.TFC.escapeHtml(contactValue || '-') + '</div></td>' +
      '<td>' + counts.activities + '</td>' +
      '<td>' + counts.evaluations + '</td>' +
      '<td>' + counts.healthEvaluations + '</td>' +
      '<td>' + counts.purchases + '</td>' +
      '<td>' + P.targetGroupBadge(participant.targetGroup) + '</td>' +
      '<td class="table-row-actions">' +
      window.TFC.actionMenuTrigger([
        { key: 'view-' + participant.id, label: 'ดูรายละเอียด', icon: 'view', href: 'detail.html?id=' + encodeURIComponent(participant.id) },
        { key: 'edit-' + participant.id, label: 'แก้ไข', icon: 'edit', href: 'form.html?id=' + encodeURIComponent(participant.id) },
        { key: 'delete-' + participant.id, label: 'ลบผู้เข้าร่วม', icon: 'delete', modal: 'participant-delete-modal', danger: true }
      ]) +
      '</td></tr>';
  }

  function renderTable() {
    svc.list().then(function (participants) {
      var keyword = (document.getElementById('participant-search').value || '').trim().toLowerCase();
      var typeFilter = document.getElementById('participant-filter-type').value;
      var targetGroupFilter = document.getElementById('participant-filter-target-group').value;
      var sourceFilter = document.getElementById('participant-filter-source').value;

      var filtered = participants.filter(function (p) {
        return matchesKeyword(p, keyword) &&
          (!typeFilter || p.type === typeFilter) &&
          (!targetGroupFilter || p.targetGroup === targetGroupFilter) &&
          (!sourceFilter || p.source === sourceFilter);
      });

      tbody.innerHTML = filtered.map(rowHtml).join('') ||
        '<tr><td colspan="10"><div class="state-block"><div class="state-title">ไม่พบผู้เข้าร่วมตามเงื่อนไขที่ค้นหา</div>' +
        '<div class="state-description">ลองปรับคำค้นหาหรือล้างตัวกรอง</div></div></td></tr>';

      document.getElementById('participant-result-count').textContent = filtered.length;
    });
  }

  ['participant-search', 'participant-filter-type', 'participant-filter-target-group', 'participant-filter-source'].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener(id === 'participant-search' ? 'input' : 'change', renderTable);
  });

  /* Action Menu เปิด Modal ให้เอง — ที่นี่ดักเฉพาะเพื่อจำว่ากำลังจะลบใคร (แพทเทิร์นเดียวกับ pages/areas/list.html) */
  document.addEventListener('click', function (e) {
    var trigger = e.target.closest('[data-action-key^="delete-"]');
    if (!trigger) return;
    pendingDeleteId = trigger.getAttribute('data-action-key').replace('delete-', '');
    var participant = P.find(pendingDeleteId);
    document.getElementById('participant-delete-message').textContent = participant
      ? 'ต้องการลบ "' + participant.name + '" ใช่หรือไม่ ประวัติกิจกรรม แบบประเมิน และการซื้อสินค้าของผู้เข้าร่วมรายนี้จะถูกลบไปด้วย'
      : 'ประวัติทั้งหมดของผู้เข้าร่วมรายนี้จะถูกลบไปด้วย';
  });

  document.getElementById('participant-delete-confirm').addEventListener('click', function () {
    if (!pendingDeleteId) return;
    var btn = this;
    if (btn.classList.contains('btn-loading')) return;
    btn.classList.add('btn-loading');
    btn.disabled = true;

    svc.remove(pendingDeleteId).then(function () {
      btn.classList.remove('btn-loading');
      btn.disabled = false;
      window.TFC.closeModal('participant-delete-modal');
      window.TFC.showToast('ลบผู้เข้าร่วมสำเร็จ (ตัวอย่าง)', 'success');
      pendingDeleteId = '';
      renderTable();
    });
  });

  renderTable();
})();
</script>
</body>
</html>
