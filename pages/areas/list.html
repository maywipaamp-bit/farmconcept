<div class="modal-overlay" id="area-form-modal">
  <div class="modal modal-xl">
    <div class="modal-header">
      <h3 class="modal-title" id="area-form-title">เพิ่มพื้นที่ดำเนินงาน</h3>
      <button type="button" class="modal-close" data-close-modal aria-label="ปิดหน้าต่าง">

      </button>
    </div>
    <form data-mock-submit="บันทึกพื้นที่ดำเนินงานสำเร็จ (ตัวอย่าง)" id="area-form">
      <div class="modal-body">
        <div class="form-row-3 mb-4">
          <div class="form-group form-col-span-2 mb-0">
            <label class="form-label" for="area-name">ชื่อพื้นที่ดำเนินงาน<span class="form-required">*</span></label>
            <input class="input" id="area-name" data-validate required>
          </div>
          <div class="form-group mb-0">
            <label class="form-label" for="area-type">ประเภทพื้นที่</label>
            <select class="select" id="area-type" data-smart-select></select>
          </div>
        </div>

        <div class="form-row-3 mb-4">
          <div class="form-group mb-0">
            <label class="form-label" for="area-group">กลุ่มพื้นที่<span class="form-required">*</span></label>
            <select class="select" id="area-group" required data-smart-select></select>
          </div>
          <div class="form-group mb-0">
            <label class="form-label" for="area-province">จังหวัด</label>
            <select class="select" id="area-province" data-smart-select></select>
          </div>
          <div class="form-group mb-0">
            <label class="form-label" for="area-district">เขต/อำเภอ</label>
            <select class="select" id="area-district" data-smart-select></select>
          </div>
        </div>

        <div class="form-row-3 mb-4">
          <div class="form-group mb-0">
            <label class="form-label" for="area-start-date">วันที่เริ่มดำเนินการ</label>
            <input type="hidden" id="area-start-date" data-thai-date>
          </div>
          <div class="form-group mb-0">
            <label class="form-label" for="area-end-date">สิ้นสุด</label>
            <input type="hidden" id="area-end-date" data-thai-date>
          </div>
          <div class="form-group mb-0">
            <label class="form-label" for="area-partner-org">ร่วมกับหน่วยงาน</label>
            <input type="hidden" id="area-partner-org" data-tags-input data-tags-placeholder="พิมพ์ชื่อหน่วยงานแล้วกด Enter">
          </div>
        </div>

        <div class="form-row-3 mb-4">
          <div class="form-group mb-0">
            <label class="form-label" for="area-coordinator">ผู้ประสานงาน<span class="form-required">*</span></label>
            <input class="input" id="area-coordinator" data-validate required>
          </div>
          <div class="form-group mb-0">
            <label class="form-label" for="area-coordinator-phone">เบอร์โทร<span class="form-required">*</span></label>

<script src="../../assets/js/app.js"></script>
<script>
(function () {
  var pageState = { page: 1, pageSize: 10 };
  var areaSvc = window.TFC.dataService('areas');
  var mock = window.TFC_MOCK || {};
  var statusBadge = { 'ดำเนินการอยู่': 'badge-success', 'ระงับชั่วคราว': 'badge-warning', 'สิ้นสุดแล้ว': 'badge-neutral' };

  function optionsHtml(list, selected) {
    return list.map(function (v) {
      return '<option value="' + window.TFC.escapeHtml(v) + '"' + (v === selected ? ' selected' : '') + '>' + window.TFC.escapeHtml(v) + '</option>';
    }).join('');
  }

  function populateStaticSelects() {
    document.getElementById('area-type').innerHTML = optionsHtml(mock.areaTypes || []);
    document.getElementById('area-group').innerHTML = optionsHtml(mock.areaGroups || []);
    document.getElementById('area-status').innerHTML = optionsHtml(mock.areaStatuses || []);
    document.getElementById('area-province').innerHTML = optionsHtml(Object.keys(mock.provinceDistricts || {}));
  }

  function populateDistricts(province, selectedDistrict) {
    var districts = (mock.provinceDistricts || {})[province] || [];
    document.getElementById('area-district').innerHTML = optionsHtml(districts, selectedDistrict);
  }

  document.getElementById('area-province').addEventListener('change', function () {
    populateDistricts(this.value, null);
  });

  function resetAreaForm() {
    document.getElementById('area-form-title').textContent = 'เพิ่มพื้นที่ดำเนินงาน';
    document.getElementById('area-form').reset();
    populateStaticSelects();
    populateDistricts(document.getElementById('area-province').value, null);
    window.TFC.setDateValue('area-start-date', '');
    window.TFC.setDateValue('area-end-date', '');
    window.TFC.setTagsValue('area-partner-org', '');
    document.getElementById('area-form').setAttribute('data-editing-id', '');
  }

  function fillAreaForm(area) {
    document.getElementById('area-form-title').textContent = 'แก้ไขพื้นที่ดำเนินงาน';
    populateStaticSelects();
    document.getElementById('area-name').value = area.name || '';
    document.getElementById('area-type').value = area.areaType || '';
    document.getElementById('area-group').value = area.areaGroup || '';
    document.getElementById('area-province').value = area.province || '';
    populateDistricts(area.province, area.district);
    window.TFC.setDateValue('area-start-date', area.startDate);
    window.TFC.setDateValue('area-end-date', area.endDate);
    window.TFC.setTagsValue('area-partner-org', area.partnerOrg);
    document.getElementById('area-coordinator').value = area.coordinator || '';
    document.getElementById('area-coordinator-phone').value = area.coordinatorPhone || '';
    document.getElementById('area-coordinator-position').value = area.coordinatorPosition || '';
    document.getElementById('area-map-url').value = area.mapUrl || '';
    document.getElementById('area-status').value = area.status || '';
    document.getElementById('area-form').setAttribute('data-editing-id', area.id);
  }

  document.addEventListener('click', function (e) {
    var trigger = e.target.closest('[data-action-key^="edit-"]');
    if (!trigger) return;
    var id = trigger.getAttribute('data-action-key').replace('edit-', '');
    var area = (mock.areas || []).filter(function (a) { return a.id === id; })[0];
    if (area) fillAreaForm(area);
  });

  function renderTable() {
    areaSvc.list().then(function (areas) {
      var keyword = (document.getElementById('area-search') || {}).value || '';
      var typeFilter = (document.getElementById('area-filter-type') || {}).value || '';
      var groupFilter = (document.getElementById('area-filter-group') || {}).value || '';
      var statusFilter = (document.getElementById('area-filter-status') || {}).value || '';
      keyword = keyword.trim().toLowerCase();

      var filtered = areas.filter(function (a) {
        return (!keyword || a.name.toLowerCase().indexOf(keyword) !== -1) &&
          (!typeFilter || a.areaType === typeFilter) &&
          (!groupFilter || a.areaGroup === groupFilter) &&
          (!statusFilter || a.status === statusFilter);
      });

      var pageCount = Math.max(1, Math.ceil(filtered.length / pageState.pageSize));
      if (pageState.page > pageCount) pageState.page = pageCount;
      var start = (pageState.page - 1) * pageState.pageSize;
      var pageRows = filtered.slice(start, start + pageState.pageSize);

      document.getElementById('area-table-body').innerHTML = pageRows.map(function (a, i) {
        return '<tr>' +
          '<td class="col-no nowrap">' + (start + i + 1) + '</td>' +
          '<td><div class="font-medium">' + window.TFC.escapeHtml(a.name) + '</div>' +
          '<div class="caption text-secondary">' + window.TFC.escapeHtml(a.district || '') + (a.district ? ' ' : '') + window.TFC.escapeHtml(a.province || '') + '</div></td>' +
          '<td>' + window.TFC.escapeHtml(a.areaType || '-') + '</td>' +
          '<td>' + window.TFC.escapeHtml(a.areaGroup || '-') + '</td>' +
          '<td>' + window.TFC.escapeHtml(a.coordinator) + '</td>' +
          '<td>' + a.activityCount + '</td>' +
          '<td class="nowrap">' + window.TFC.statusTextHTML({ options: mock.areaStatusList, value: a.status }) + '</td>' +
          '<td><div class="cell-updated-by">' + window.TFC.escapeHtml(a.updatedBy || '-') + '</div>' +
          '<div class="cell-updated-at">' + (a.updatedAt ? window.TFC.formatThaiDate(a.updatedAt) : '-') + '</div></td>' +
          '<td class="table-row-actions">' +
          window.TFC.actionMenuTrigger([
            { key: 'edit-' + a.id, label: 'แก้ไข', icon: 'edit', modal: 'area-form-modal', perm: 'areas' },
            { key: 'area-delete-' + a.id, label: 'ลบพื้นที่', icon: 'delete', modal: 'area-delete-modal', perm: 'areas', danger: true }
          ]) +
          '</td></tr>';
      }).join('');

      var totalActivities = filtered.reduce(function (sum, row) { return sum + (row.activityCount || 0); }, 0);
      document.getElementById('area-table-foot').innerHTML = filtered.length
        ? '<tr><td colspan="5">รวม ' + filtered.length + ' พื้นที่</td>' +
          '<td>' + totalActivities + '</td><td></td><td></td><td></td></tr>'
        : '';

      window.TFC.renderPagination('area-pagination', {
        page: pageState.page,
        pageSize: pageState.pageSize,
        total: filtered.length,
        pageSizeOptions: [10, 20, 50],
        footer: true,
        onChange: function (p) { pageState.page = p; renderTable(); },
        onPageSizeChange: function (size) { pageState.pageSize = size; pageState.page = 1; renderTable(); }
      });
    });
  }

  window.TFC.renderPageHeader('area-page-header', {
    title: 'พื้นที่ดำเนินงาน',
    actions: [
      {
        label: 'เพิ่มพื้นที่ดำเนินงาน',
        icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
        attrs: { id: 'area-add-btn', 'data-open-modal': 'area-form-modal' }
      }
    ]
  });
  document.getElementById('area-add-btn').addEventListener('click', resetAreaForm);

  /* แถบค้นหา/ตัวกรองย้ายเข้า Search Panel Popover — ใช้ id เดิมเพื่อให้ renderTable() อ่านค่าได้เหมือนเดิม */
  window.TFC.attachListToolbar({
    chipId: 'area-filter-chip',
    chipLabelId: 'area-filter-chip-label',
    popoverId: 'area-search-popover',
    search: { id: 'area-search', placeholder: 'ค้นหาชื่อพื้นที่' },
    filters: [
      { id: 'type', inputId: 'area-filter-type', label: 'ประเภทพื้นที่', placeholder: 'ประเภทพื้นที่ทั้งหมด',
        options: (mock.areaTypes || []).map(function (v) { return { label: v }; }) },
      { id: 'group', inputId: 'area-filter-group', label: 'กลุ่มพื้นที่', placeholder: 'กลุ่มพื้นที่ทั้งหมด',
        options: (mock.areaGroups || []).map(function (v) { return { label: v }; }) },
      { id: 'status', inputId: 'area-filter-status', label: 'สถานะ', placeholder: 'สถานะทั้งหมด',
        options: (mock.areaStatuses || []).map(function (v) { return { label: v }; }) }
    ],
    onApply: function (values, done) {
      pageState.page = 1;
      renderTable();
      done();
    }
  });

  document.getElementById('area-export').addEventListener('click', function () {
    window.TFC.exportTableCsv('#area-table-body', 'พื้นที่ดำเนินงาน.csv');
  });

  ['area-search', 'area-filter-type', 'area-filter-group', 'area-filter-status'].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener(id === 'area-search' ? 'input' : 'change', renderTable);
  });

  document.getElementById('area-form').addEventListener('submit', function () {
    var editingId = this.getAttribute('data-editing-id');
    var payload = {
      name: document.getElementById('area-name').value,
      areaType: document.getElementById('area-type').value,
      areaGroup: document.getElementById('area-group').value,
      province: document.getElementById('area-province').value,
      district: document.getElementById('area-district').value,
      startDate: document.getElementById('area-start-date').value,
      endDate: document.getElementById('area-end-date').value,
      partnerOrg: document.getElementById('area-partner-org').value,
      coordinator: document.getElementById('area-coordinator').value,
      coordinatorPhone: document.getElementById('area-coordinator-phone').value,
      coordinatorPosition: document.getElementById('area-coordinator-position').value,
      mapUrl: document.getElementById('area-map-url').value,
      status: document.getElementById('area-status').value,
      updatedBy: (mock.currentUser || {}).name || ''
    };
    var save = editingId ? areaSvc.update(editingId, payload) : areaSvc.create(Object.assign({ activityCount: 0, totalParticipants: 0, avgSatisfaction: 0 }, payload));
    save.then(renderTable);
  });

  renderTable();

  /* ลบรายการ: จำ id จากเมนู ⋮ แล้วลบจริงเมื่อกดยืนยันในโมดัล */
  var pendingDeleteId = null;
  document.addEventListener('click', function (e) {
    var item = e.target.closest('[data-action-key^="area-delete-"]');
    if (item) pendingDeleteId = item.getAttribute('data-action-key').replace('area-delete-', '');
  });

  document.getElementById('area-delete-confirm').addEventListener('click', function () {
    if (!pendingDeleteId) return;
    areaSvc.remove(pendingDeleteId).then(function () {
      pendingDeleteId = null;
      renderTable();
      if (window.TFC.showToast) window.TFC.showToast('ลบพื้นที่ดำเนินงานเรียบร้อย', 'success');
    });
  });
})();
</script>
