<!DOCTYPE html>

<head>

</head>
<body>

<div class="app-shell">
<script>(function(){try{if(localStorage.getItem('tfc-sidebar-collapsed')==='1'){document.currentScript.parentElement.classList.add('is-sidebar-collapsed');}}catch(e){}})();</script>
  <div class="sidebar-overlay"></div>

  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="../../index.html" class="sidebar-brand">
        <span class="sidebar-logo">TF</span>
        <span class="sidebar-title">TheFarmConcept</span>
      </a>
      <button type="button" class="sidebar-toggle" data-sidebar-collapse-toggle aria-label="ย่อ/ขยายเมนู">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav" aria-label="เมนูหลัก" data-nav-base="../../"></nav>
  </aside>

  <script src="../../assets/js/mock-data.js"></script>
  <script src="../../assets/js/menu-config.js"></script>
  <script src="../../assets/js/sidebar-render.js"></script>

  <div class="app-main">
    <header class="topbar">
      <button type="button" class="topbar-menu-btn" data-sidebar-open aria-label="เปิดเมนู">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>

      <div class="topbar-breadcrumb">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="../../dashboard.html">แดชบอร์ด</a> <span>/</span> <span class="is-current">จัดการกิจกรรม</span>
        </nav>
      </div>

      <div class="topbar-search hidden-mobile">
        <div class="search-input">
          <span class="search-input-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span>
          <input type="search" class="input" placeholder="ค้นหา...">
        </div>
      </div>

      <div class="topbar-actions">
        <div class="dropdown">
          <button type="button" class="topbar-icon-btn" data-dropdown-toggle aria-label="การแจ้งเตือน">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
            <span class="badge-dot" data-notification-badge></span>
          </button>
          <div class="dropdown-menu notification-menu">
            <div class="dropdown-menu-header">การแจ้งเตือน</div>
            <div data-notification-list></div>
          </div>
        </div>

        <div class="dropdown">
          <button type="button" class="topbar-profile" data-dropdown-toggle aria-label="เมนูผู้ใช้งาน">
            <span class="avatar avatar-sm">สม</span>
            <span class="topbar-profile-info hidden-mobile">
              <span class="topbar-profile-name">สุนิสา แก้วมณี</span>
              <span class="topbar-profile-role">เจ้าหน้าที่โครงการ</span>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="dropdown-menu">
            <a class="dropdown-item" href="../profile.html">โปรไฟล์ของฉัน</a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item is-danger" href="../../login.html">ออกจากระบบ</a>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="page-header" id="activity-page-header"></div>

      <div class="summary-cards" id="activity-stat-cards"></div>

      <div class="page-toolbar" id="activity-filter-row"></div>

      <div class="table-wrapper mb-4">
        <table class="data-table">
          <thead>
            <tr>
              <th>ลำดับ</th>
              <th data-sort="name">ชื่อกิจกรรม <span class="sort-icon">↕</span></th>
              <th>พื้นที่ดำเนินงาน</th>
              <th data-sort="startDate">วันที่จัดกิจกรรม <span class="sort-icon">↕</span></th>
              <th data-sort="registered">ผู้ลงทะเบียน <span class="sort-icon">↕</span></th>
              <th>สถานะ</th>
              <th>จัดการ</th>
            </tr>
          </thead>
          <tbody id="activity-table-body"></tbody>
        </table>
      </div>

      <div class="table-wrapper" id="activity-pagination"></div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="activity-delete-modal">
  <div class="modal modal-sm">
    <div class="modal-body text-center">
      <span class="modal-confirm-icon is-danger mx-auto">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
      </span>
      <h3 class="modal-title mb-3">ยืนยันการลบกิจกรรม</h3>
      <p class="text-secondary" id="activity-delete-message"></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close-modal>ยกเลิก</button>
      <button class="btn btn-danger" id="activity-delete-confirm" data-close-modal>ลบกิจกรรม</button>
    </div>
  </div>
</div>

<script src="../../assets/js/data-service.js"></script>
<script src="../../assets/js/navigation.js"></script>
<script src="../../assets/js/modal.js"></script>
<script src="../../assets/js/action-menu.js"></script>
<script src="../../assets/js/index-layout.js"></script>
<script src="../../assets/js/toast.js"></script>
<script src="../../assets/js/form.js"></script>
<script src="../../assets/js/smart-select.js"></script>
<script src="../../assets/js/activity-module.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
(function () {
  var mock = window.TFC_MOCK;
  var activities = mock.activities || [];
  var PAGE_SIZE = 10;
  var state = { search: '', participantType: '', targetGroup: '', dataSource: '', sortKey: 'startDate', sortDir: 'asc', page: 1 };
  var deleteTargetId = null;

  window.TFC.renderPageHeader('activity-page-header', {
    title: 'จัดการกิจกรรม',
    description: 'จัดการกิจกรรมและอีเวนท์ทั้งหมดของโครงการ TheFarmConcept',
    actions: [
      {
        label: 'เพิ่มกิจกรรม',
        href: 'create.html',
        icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>'
      }
    ]
  });

  var totalRegistered = activities.reduce(function (sum, item) { return sum + item.registered; }, 0);
  var totalCapacity = activities.reduce(function (sum, item) { return sum + item.capacity; }, 0);
  var openCount = activities.filter(function (item) { return item.status === 'เปิดรับสมัคร'; }).length;
  var fullCount = activities.filter(function (item) { return item.status === 'เต็มแล้ว'; }).length;

  window.TFC.renderStatCards('activity-stat-cards', [
    {
      icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
      label: 'กิจกรรมทั้งหมด',
      value: activities.length
    },
    {
      icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>',
      tone: 'success',
      label: 'เปิดรับสมัคร',
      value: openCount
    },
    {
      icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
      tone: 'warning',
      label: 'เต็มแล้ว',
      value: fullCount
    },
    {
      icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg>',
      tone: 'info',
      label: 'ผู้ลงทะเบียนรวม',
      value: totalRegistered,
      target: totalCapacity
    }
  ]);

  window.TFC.renderFilterRow('activity-filter-row', {
    resultCountId: 'activity-result-count',
    resultCount: activities.length,
    filters: [
      {
        id: 'activity-filter-type',
        placeholder: 'ประเภททั้งหมด',
        options: (mock.activityParticipantTypes || []).map(function (value) { return { label: value }; })
      },
      {
        id: 'activity-filter-target',
        placeholder: 'กลุ่มเป้าหมายทั้งหมด',
        options: (mock.targetGroups || []).map(function (group) { return { label: group.name }; })
      },
      {
        id: 'activity-filter-source',
        placeholder: 'แหล่งที่มาข้อมูลทั้งหมด',
        options: (mock.activityDataSources || []).map(function (value) { return { label: value }; })
      }
    ],
    search: { id: 'activity-search', placeholder: 'ค้นหาชื่อกิจกรรม/รหัส หรือชื่อ-เบอร์-อีเมลผู้เข้าร่วม...' },
    extraButton: {
      label: 'ล้างตัวกรอง',
      icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>',
      attrs: { id: 'activity-clear-filter' }
    }
  });

  var tbody = document.getElementById('activity-table-body');
  var resultCountEl = document.getElementById('activity-result-count');
  var clearBtn = document.getElementById('activity-clear-filter');
  var searchEl = document.getElementById('activity-search');

  /* ค้นหาแบบ partial match: ชื่อ/รหัสกิจกรรม หรือ ชื่อ-เบอร์-อีเมล ของผู้เข้าร่วมในกิจกรรมนั้น
     (สเปกระบุให้ค้นจากผู้เข้าร่วม แต่ตารางแสดงกิจกรรม จึงตีความว่า "กรองกิจกรรมที่มีผู้เข้าร่วมตรงเงื่อนไข" — รอยืนยัน) */
  function matchSearch(activity, term) {
    if (!term) return true;
    if ((activity.name + ' ' + activity.id).toLowerCase().indexOf(term) !== -1) return true;
    return (mock.activityRegistrations[activity.id] || []).some(function (person) {
      return (person.name + ' ' + person.phone + ' ' + person.email).toLowerCase().indexOf(term) !== -1;
    });
  }

  function filteredRows() {
    var term = state.search.trim().toLowerCase();
    var rows = activities.filter(function (activity) {
      if (state.participantType && activity.participantType !== state.participantType) return false;
      if (state.targetGroup && (activity.targetGroups || []).indexOf(state.targetGroup) === -1) return false;
      if (state.dataSource && activity.dataSource !== state.dataSource) return false;
      return matchSearch(activity, term);
    });

    var dir = state.sortDir === 'asc' ? 1 : -1;
    return rows.sort(function (a, b) {
      var left = a[state.sortKey];
      var right = b[state.sortKey];
      if (state.sortKey === 'registered') return (left - right) * dir;
      return String(left).localeCompare(String(right), 'th') * dir;
    });
  }

  function activeFilterCount() {
    return ['participantType', 'targetGroup', 'dataSource'].filter(function (key) { return state[key]; }).length +
      (state.search.trim() ? 1 : 0);
  }

  function rowHtml(activity, index) {
    var schedules = window.TFC.activity.schedules(activity);
    var roundBadge = schedules.length > 1
      ? ' <span class="badge badge-info">+' + schedules.length + ' รอบ</span>'
      : '';
    var areas = (activity.areaList && activity.areaList.length ? activity.areaList : [activity.area]);

    return '<tr data-id="' + activity.id + '">' +
      '<td>' + index + '</td>' +
      '<td><div class="cell-stack">' +
      '<span class="cell-stack-title">' + window.TFC.escapeHtml(activity.name) + '</span>' +
      '<span class="cell-stack-sub">' + activity.id + '</span>' +
      '</div></td>' +
      '<td><div class="tag-list">' + areas.map(function (area) {
        return '<span class="tag">' + window.TFC.escapeHtml(area) + '</span>';
      }).join('') + '</div></td>' +
      '<td>' + window.TFC.activity.dateLabel(activity) + roundBadge + '</td>' +
      '<td>' + activity.registered + '/' + activity.capacity + '</td>' +
      '<td>' + window.TFC.activity.statusSelectHTML('activity', activity.status, {
        rowId: activity.id, ariaLabel: 'สถานะกิจกรรม ' + activity.name
      }) + '</td>' +
      '<td class="table-row-actions">' +
      window.TFC.actionMenuTrigger([
        { key: 'view', label: 'ดูรายละเอียด', icon: 'view', href: 'detail.html?id=' + activity.id },
        { key: 'edit', label: 'แก้ไข', icon: 'edit', href: 'edit.html?id=' + activity.id, perm: 'activities' },
        { key: 'delete', label: 'ลบกิจกรรม', icon: 'delete', modal: 'activity-delete-modal', perm: 'activities', danger: true }
      ]) +
      '</td></tr>';
  }

  var EMPTY_HTML = '<tr><td colspan="7">' +
    '<div class="state-placeholder">' +
    '<span class="state-placeholder-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span>' +
    '<div class="state-placeholder-title">ไม่พบกิจกรรมที่ตรงกับเงื่อนไข</div>' +
    '<div class="state-placeholder-desc">ลองปรับคำค้นหาหรือล้างตัวกรองแล้วค้นหาอีกครั้ง</div>' +
    '</div></td></tr>';

  function render() {
    var rows = filteredRows();
    var pageCount = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    if (state.page > pageCount) state.page = pageCount;
    var start = (state.page - 1) * PAGE_SIZE;
    var pageRows = rows.slice(start, start + PAGE_SIZE);

    tbody.innerHTML = pageRows.length
      ? pageRows.map(function (activity, i) { return rowHtml(activity, start + i + 1); }).join('')
      : EMPTY_HTML;

    resultCountEl.textContent = rows.length;

    /* badge จำนวนตัวกรองที่ Active บนปุ่ม "ล้างตัวกรอง" */
    var count = activeFilterCount();
    var badge = clearBtn.querySelector('.filter-count');
    if (count) {
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'filter-count';
        clearBtn.appendChild(badge);
      }
      badge.textContent = count;
    } else if (badge) {
      badge.remove();
    }

    document.querySelectorAll('.data-table th[data-sort]').forEach(function (th) {
      var isSorted = th.getAttribute('data-sort') === state.sortKey;
      th.classList.toggle('is-sorted', isSorted);
      th.querySelector('.sort-icon').textContent = isSorted ? (state.sortDir === 'asc' ? '↑' : '↓') : '↕';
    });

    window.TFC.renderPagination('activity-pagination', {
      page: state.page,
      pageSize: PAGE_SIZE,
      total: rows.length,
      onChange: function (page) { state.page = page; render(); }
    });
  }

  /* Loading skeleton ก่อนข้อมูลชุดแรกจะพร้อม (mock: หน่วง 500ms) */
  tbody.innerHTML = new Array(5).fill('<tr><td colspan="7"><div class="skeleton skeleton-text"></div></td></tr>').join('');
  setTimeout(render, 500);

  /* ---------- ตัวกรอง ---------- */
  var searchTimer = null;
  searchEl.addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.search = searchEl.value;
      state.page = 1;
      render();
    }, 300);
  });

  [['activity-filter-type', 'participantType'], ['activity-filter-target', 'targetGroup'], ['activity-filter-source', 'dataSource']]
    .forEach(function (pair) {
      document.getElementById(pair[0]).addEventListener('change', function (e) {
        state[pair[1]] = e.target.value;
        state.page = 1;
        render();
      });
    });

  clearBtn.addEventListener('click', function () {
    state.search = state.participantType = state.targetGroup = state.dataSource = '';
    state.page = 1;
    searchEl.value = '';
    ['activity-filter-type', 'activity-filter-target', 'activity-filter-source'].forEach(function (id) {
      document.getElementById(id).value = '';
    });
    render();
  });

  /* ---------- เรียงลำดับ ---------- */
  document.querySelectorAll('.data-table th[data-sort]').forEach(function (th) {
    th.addEventListener('click', function () {
      var key = th.getAttribute('data-sort');
      if (state.sortKey === key) {
        state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        state.sortKey = key;
        state.sortDir = 'asc';
      }
      render();
    });
  });

  /* ---------- ลบกิจกรรม: จำแถวที่กดจากปุ่ม ⋮ แล้วปรับข้อความ/ปุ่มในโมดัลตามจำนวนผู้ลงทะเบียน ---------- */
  tbody.addEventListener('click', function (e) {
    var trigger = e.target.closest('[data-action-menu]');
    if (!trigger) return;
    var row = trigger.closest('tr');
    deleteTargetId = row ? row.getAttribute('data-id') : null;

    var activity = window.TFC.activity.get(deleteTargetId);
    var messageEl = document.getElementById('activity-delete-message');
    var confirmBtn = document.getElementById('activity-delete-confirm');
    if (!activity) return;

    if (activity.registered > 0) {
      messageEl.innerHTML = 'กิจกรรม "' + window.TFC.escapeHtml(activity.name) + '" มีผู้ลงทะเบียนแล้ว ' +
        activity.registered + ' คน จึงลบไม่ได้<br>หากต้องการยุติกิจกรรม ให้เปลี่ยนสถานะเป็น "ยกเลิก" แทน';
      confirmBtn.disabled = true;
    } else {
      messageEl.textContent = 'ต้องการลบกิจกรรม "' + activity.name + '" ใช่หรือไม่ การลบนี้ไม่สามารถย้อนกลับได้';
      confirmBtn.disabled = false;
    }
  });

  document.getElementById('activity-delete-confirm').addEventListener('click', function () {
    var index = activities.findIndex(function (a) { return a.id === deleteTargetId; });
    if (index === -1) return;
    var removed = activities.splice(index, 1)[0];
    render();
    if (window.TFC.showToast) window.TFC.showToast('ลบกิจกรรม "' + removed.name + '" แล้ว', 'success');
  });
})();
</script>
</body>
</html>
