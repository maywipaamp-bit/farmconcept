<script>(function(){try{if(localStorage.getItem('tfc-sidebar-collapsed')==='1'){document.currentScript.parentElement.classList.add('is-sidebar-collapsed');}}catch(e){}})();</script>

<script src="../../assets/js/navigation.js"></script>

<script src="../../assets/js/app.js"></script>
<script>
(function () {
  var mock = window.TFC_MOCK;
  var activities = mock.activities || [];
  var PAGE_SIZES = [10, 20, 50];
  var MAX_RESULTS = 250;      /* เพดานจำนวนแถวที่แสดงต่อการค้นหา 1 ครั้ง (แจ้งไว้ในหัวแผงค้นหา) */
  var state = { search: '', participantType: '', targetGroup: '', dataSource: '', sortKey: 'startDate', sortDir: 'asc', page: 1, pageSize: PAGE_SIZES[0] };
  var deleteTargetId = null;

  window.TFC.renderPageHeader('activity-page-header', {
    title: 'จัดการกิจกรรม',
    actions: [
      {
        label: 'เพิ่มกิจกรรม',
        href: 'create.html',
        icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>'
      }
    ]
  });

  /* แถบค้นหา/ตัวกรองเดิมถูกย้ายเข้า Search Panel Popover (ไอคอนแว่นขยายมุมขวาของแถบเครื่องมือ)
     เงื่อนไขการค้นหาเหมือนเดิมทุกข้อ เปลี่ยนแค่วิธีเปิดใช้งาน เพื่อคืนพื้นที่หน้าจอให้ตาราง */
  var searchPanel = window.TFC.searchPopover('activity-search-popover', {
    search: { placeholder: 'ค้นหากิจกรรมหรือผู้เข้าร่วม' },
    filters: [
      {
        id: 'participantType',
        label: 'ประเภท',
        placeholder: 'ประเภททั้งหมด',
        options: (mock.activityParticipantTypes || []).map(function (value) { return { label: value }; })
      },
      {
        id: 'targetGroup',
        label: 'กลุ่มเป้าหมาย',
        placeholder: 'กลุ่มเป้าหมายทั้งหมด',
        options: (mock.targetGroups || []).map(function (group) { return { label: group.name }; })
      },
      {
        id: 'dataSource',
        label: 'แหล่งที่มาข้อมูล',
        placeholder: 'แหล่งที่มาข้อมูลทั้งหมด',
        options: (mock.activityDataSources || []).map(function (value) { return { label: value }; })
      }
    ],
    onSearch: function (values, done) {
      state.search = values.keyword;
      state.participantType = values.filters.participantType;
      state.targetGroup = values.filters.targetGroup;
      state.dataSource = values.filters.dataSource;
      state.page = 1;
      renderWithLoading(done);
    },
    onClear: function () {
      state.search = state.participantType = state.targetGroup = state.dataSource = '';
      state.page = 1;
      renderWithLoading();
    }
  });

  var tbody = document.getElementById('activity-table-body');
  var chipLabel = document.getElementById('activity-filter-chip-label');
  var chipBtn = document.getElementById('activity-filter-chip');

  /* ค้นหาแบบ partial match: ชื่อ/รหัสกิจกรรม หรือ ชื่อ-เบอร์-อีเมล ของผู้เข้าร่วมในกิจกรรมนั้น
     (สเปกระบุให้ค้นจากผู้เข้าร่วม แต่ตารางแสดงกิจกรรม จึงตีความว่า "กรองกิจกรรมที่มีผู้เข้าร่วมตรงเงื่อนไข" — รอยืนยัน) */
  function matchSearch(activity, term) {
    if (!term) return true;
    if ((activity.name + ' ' + activity.id).toLowerCase().indexOf(term) !== -1) return true;
    return (mock.activityRegistrations[activity.id] || []).some(function (person) {
      return (person.name + ' ' + person.phone + ' ' + person.email).toLowerCase().indexOf(term) !== -1;
    });
  }

  function filteredRows() {
    var term = state.search.trim().toLowerCase();
    var rows = activities.filter(function (activity) {
      if (state.participantType && activity.participantType !== state.participantType) return false;
      if (state.targetGroup && (activity.targetGroups || []).indexOf(state.targetGroup) === -1) return false;
      if (state.dataSource && activity.dataSource !== state.dataSource) return false;
      return matchSearch(activity, term);
    });

    var dir = state.sortDir === 'asc' ? 1 : -1;
    rows.sort(function (a, b) {
      var left = a[state.sortKey];
      var right = b[state.sortKey];
      if (state.sortKey === 'registered') return (left - right) * dir;
      return String(left).localeCompare(String(right), 'th') * dir;
    });

    return rows.slice(0, MAX_RESULTS);
  }

  /* ไอคอนของบรรทัดข้อมูลย่อยในเซลล์ชื่อกิจกรรม */
  var META_ICON = {
    date: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    place: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>',
    person: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
    price: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><path d="M7 7h.01"/></svg>'
  };

  function metaRow(icon, text, extraClass) {
    return '<span class="cell-meta' + (extraClass ? ' ' + extraClass : '') + '">' + icon +
      '<span>' + window.TFC.escapeHtml(text) + '</span></span>';
  }

  /* โครงคอลัมน์: # | ชื่อกิจกรรม (เรียงลงมา: วันเวลา / พื้นที่ / วิทยากร / ค่าลงทะเบียน) | ประเภท | รูปแบบกิจกรรม | ผู้ลงทะเบียน | สถานะ | ปรับปรุงล่าสุด | จัดการ */
  function rowHtml(activity, index) {
    var schedules = window.TFC.activity.schedules(activity);
    var roundBadge = schedules.length > 1
      ? ' <span class="badge badge-info">+' + schedules.length + ' รอบ</span>'
      : '';
    var areas = (activity.areaList && activity.areaList.length ? activity.areaList : [activity.area]);
    var instructors = (activity.instructorList && activity.instructorList.length ? activity.instructorList : [activity.instructor]);
    var statusTone = window.TFC.badgeClassOf(mock.activityStatuses, activity.status).replace('badge-', 'is-');
    var timeText = schedules.length && schedules[0].timeStart
      ? ' · ' + schedules[0].timeStart + '-' + schedules[0].timeEnd + ' น.'
      : '';

    return '<tr data-id="' + activity.id + '">' +
      '<td class="col-no nowrap">' + index + '</td>' +
      '<td><div class="cell-stack">' +
      '<span class="cell-stack-title-row">' +
      '<span class="status-dot ' + statusTone + '"></span>' +
      /* คลิกชื่อกิจกรรมเพื่อเข้าหน้าแก้ไขได้ทันที */
      '<a class="cell-stack-title cell-link" href="edit.html?id=' + activity.id + '">' +
      window.TFC.escapeHtml(activity.name) + '</a>' +
      '</span>' +
      '<div class="cell-meta-list">' +
      '<span class="cell-meta">' + META_ICON.date +
      '<span>' + window.TFC.activity.dateLabel(activity) + timeText + roundBadge + '</span></span>' +
      metaRow(META_ICON.place, areas.join(' · ')) +
      (instructors.filter(Boolean).length ? metaRow(META_ICON.person, instructors.join(' · ')) : '') +
      metaRow(META_ICON.price, window.TFC.activity.feeLabel(activity), 'is-price') +
      '</div></div></td>' +
      '<td class="nowrap"><span class="tag tag-primary">' + window.TFC.escapeHtml(activity.type) + '</span></td>' +
      '<td><span class="tag">' + window.TFC.escapeHtml(activity.format) + '</span></td>' +
      '<td class="nowrap text-right">' + activity.registered + '/' + activity.capacity + '</td>' +
      '<td class="nowrap">' + window.TFC.activity.statusSelectHTML('activity', activity.status, {
        rowId: activity.id, ariaLabel: 'สถานะกิจกรรม ' + activity.name
      }) + '</td>' +
      '<td class="col-updated nowrap"><div class="cell-stack">' +
      '<span class="cell-updated-by">' + window.TFC.escapeHtml(activity.updatedBy || '-') + '</span>' +
      '<span class="cell-updated-at">' + window.TFC.formatThaiShort(activity.updatedAt) + '</span>' +
      '</div></td>' +
      '<td class="table-row-actions">' +
      window.TFC.actionMenuTrigger([
        { key: 'view', label: 'ดูรายละเอียด', icon: 'view', href: 'detail.html?id=' + activity.id },
        { key: 'edit', label: 'แก้ไข', icon: 'edit', href: 'edit.html?id=' + activity.id, perm: 'activities' },
        { key: 'delete', label: 'ลบกิจกรรม', icon: 'delete', modal: 'activity-delete-modal', perm: 'activities', danger: true }
      ]) +
      '</td></tr>';
  }

  var EMPTY_HTML = '<tr><td colspan="8">' +
    '<div class="state-placeholder">' +
    '<span class="state-placeholder-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span>' +
    '<div class="state-placeholder-title">ไม่พบกิจกรรมที่ตรงกับเงื่อนไข</div>' +
    '<div class="state-placeholder-desc">ลองปรับคำค้นหาหรือล้างตัวกรองแล้วค้นหาอีกครั้ง</div>' +
    '</div></td></tr>';

  function render() {
    var rows = filteredRows();
    var pageCount = Math.max(1, Math.ceil(rows.length / state.pageSize));
    if (state.page > pageCount) state.page = pageCount;
    var start = (state.page - 1) * state.pageSize;
    var pageRows = rows.slice(start, start + state.pageSize);

    tbody.innerHTML = pageRows.length
      ? pageRows.map(function (activity, i) { return rowHtml(activity, start + i + 1); }).join('')
      : EMPTY_HTML;

    syncChip();

    document.querySelectorAll('.data-table th[data-sort]').forEach(function (th) {
      var isSorted = th.getAttribute('data-sort') === state.sortKey;
      th.classList.toggle('is-sorted', isSorted);
      th.querySelector('.sort-icon').textContent = isSorted ? (state.sortDir === 'asc' ? '↑' : '↓') : '↕';
    });

    window.TFC.renderPagination('activity-pagination', {
      page: state.page,
      pageSize: state.pageSize,
      total: rows.length,
      pageSizeOptions: PAGE_SIZES,
      footer: true,
      onChange: function (page) { state.page = page; render(); },
      onPageSizeChange: function (size) { state.pageSize = size; state.page = 1; render(); }
    });
  }

  /* ---------- ชิปบอกสถานะการกรอง ---------- */
  function activeFilters() {
    return [
      state.search.trim() ? '"' + state.search.trim() + '"' : '',
      state.participantType,
      state.targetGroup,
      state.dataSource
    ].filter(Boolean);
  }

  function syncChip() {
    var active = activeFilters();
    chipBtn.classList.toggle('is-active', active.length > 0);
    chipLabel.textContent = active.length ? 'กรองอยู่: ' + active.join(' · ') : 'แสดงทั้งหมด';
  }

  chipBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    searchPanel.open();
  });

  /* ---------- ส่งออก Excel (CSV UTF-8) ---------- */
  function exportRows(rows, filename) {
    window.TFC.exportCsv(filename,
      ['รหัสกิจกรรม', 'ชื่อกิจกรรม', 'ประเภท', 'รูปแบบกิจกรรม', 'พื้นที่ดำเนินงาน', 'วันที่จัดกิจกรรม',
        'ผู้ลงทะเบียน', 'จำนวนรับสมัคร', 'สถานะ', 'ผู้บันทึกล่าสุด', 'วันเวลาที่บันทึก'],
      rows.map(function (activity) {
        return [activity.id, activity.name, activity.type, activity.format,
          (activity.areaList || [activity.area]).join(', '),
          window.TFC.activity.dateLabel(activity),
          activity.registered, activity.capacity, activity.status,
          activity.updatedBy || '', window.TFC.formatThaiShort(activity.updatedAt)];
      }));
  }

  document.getElementById('activity-export').addEventListener('click', function () {
    exportRows(filteredRows(), 'รายการกิจกรรม.csv');
  });

  /* Loading state: โชว์ skeleton ระหว่างค้นหา แล้วค่อยวาดตาราง (mock ของการเรียก API) */
  function renderWithLoading(done) {
    tbody.innerHTML = new Array(5).fill('<tr><td colspan="8"><div class="skeleton skeleton-text"></div></td></tr>').join('');
    setTimeout(function () {
      render();
      if (typeof done === 'function') done();
    }, 400);
  }

  renderWithLoading();

  /* ---------- เรียงลำดับ ---------- */
  document.querySelectorAll('.data-table th[data-sort]').forEach(function (th) {
    th.addEventListener('click', function () {
      var key = th.getAttribute('data-sort');
      if (state.sortKey === key) {
        state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        state.sortKey = key;
        state.sortDir = 'asc';
      }
      render();
    });
  });

  /* ---------- ลบกิจกรรม: จำแถวที่กดจากปุ่ม ⋮ แล้วปรับข้อความ/ปุ่มในโมดัลตามจำนวนผู้ลงทะเบียน ---------- */
  tbody.addEventListener('click', function (e) {
    var trigger = e.target.closest('[data-action-menu]');
    if (!trigger) return;
    var row = trigger.closest('tr');
    deleteTargetId = row ? row.getAttribute('data-id') : null;

    var activity = window.TFC.activity.get(deleteTargetId);
    var messageEl = document.getElementById('activity-delete-message');
    var confirmBtn = document.getElementById('activity-delete-confirm');
    if (!activity) return;

    if (activity.registered > 0) {
      messageEl.innerHTML = 'กิจกรรม "' + window.TFC.escapeHtml(activity.name) + '" มีผู้ลงทะเบียนแล้ว ' +
        activity.registered + ' คน จึงลบไม่ได้<br>หากต้องการยุติกิจกรรม ให้เปลี่ยนสถานะเป็น "ยกเลิก" แทน';
      confirmBtn.disabled = true;
    } else {
      messageEl.textContent = 'ต้องการลบกิจกรรม "' + activity.name + '" ใช่หรือไม่ การลบนี้ไม่สามารถย้อนกลับได้';
      confirmBtn.disabled = false;
    }
  });

  document.getElementById('activity-delete-confirm').addEventListener('click', function () {
    var index = activities.findIndex(function (a) { return a.id === deleteTargetId; });
    if (index === -1) return;
    var removed = activities.splice(index, 1)[0];
    render();
    if (window.TFC.showToast) window.TFC.showToast('ลบกิจกรรม "' + removed.name + '" แล้ว', 'success');
  });
})();
</script>
</body>
</html>
