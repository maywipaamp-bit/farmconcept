<script>
(function () {
  var activity = window.TFC.activity.get(window.TFC.activity.currentId());
  if (!activity) return;

  document.getElementById('edit-page-title').textContent = 'แก้ไข: ' + activity.name;
  document.getElementById('edit-page-subtitle').textContent = 'รหัสกิจกรรม ' + activity.id + ' · ปรับข้อมูลแล้วดูตัวอย่างการแสดงผลได้ทางด้านขวา';
  document.getElementById('edit-detail-link').href = 'detail.html?id=' + activity.id;

  window.TFC.renderActivityForm('activity-form-mount', { mode: 'edit', activity: activity });
})();
</script>
