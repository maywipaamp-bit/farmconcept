<!DOCTYPE html>
<html lang="th" class="is-preload">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Template | TheFarmConcept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/utilities.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

<div class="app-shell">
<script>(function(){try{if(localStorage.getItem('tfc-sidebar-collapsed')==='1'){document.currentScript.parentElement.classList.add('is-sidebar-collapsed');}}catch(e){}})();</script>
  <div class="sidebar-overlay"></div>

  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="index.html" class="sidebar-brand">
        <span class="sidebar-logo">TF</span>
        <span class="sidebar-title">TheFarmConcept</span>
      </a>
      <button type="button" class="sidebar-toggle" data-sidebar-collapse-toggle aria-label="ย่อ/ขยายเมนู">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav" aria-label="เมนูหลัก" data-nav-base=""></nav>
  </aside>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/menu-config.js"></script>
  <script src="assets/js/sidebar-render.js"></script>

  <div class="app-main">
    <header class="topbar">
      <button type="button" class="topbar-menu-btn" data-sidebar-open aria-label="เปิดเมนู">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>

      <div class="topbar-breadcrumb">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="dashboard.html">แดชบอร์ด</a> <span>/</span>
          <a href="crud-template.html">รายการกิจกรรม</a> <span>/</span>
          <span class="is-current">Form Template</span>
        </nav>
      </div>

      <div class="topbar-actions">
        <div class="dropdown">
          <button type="button" class="topbar-profile" data-dropdown-toggle aria-label="เมนูผู้ใช้งาน">
            <span class="avatar avatar-sm">สม</span>
            <span class="topbar-profile-info hidden-mobile">
              <span class="topbar-profile-name">สุนิสา แก้วมณี</span>
              <span class="topbar-profile-role">เจ้าหน้าที่โครงการ</span>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="dropdown-menu">
            <a class="dropdown-item" href="pages/profile.html">โปรไฟล์ของฉัน</a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item is-danger" href="login.html">ออกจากระบบ</a>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="page-header">
        <div class="page-header-text">
          <h1>แก้ไขกิจกรรม</h1>
          <p class="page-description">ตัวอย่าง Template สำหรับหน้าจอสร้าง/แก้ไขข้อมูลทุกโมดูล (Create / Edit Form)</p>
        </div>
      </div>

      <form data-mock-submit="บันทึกข้อมูลกิจกรรมสำเร็จ" data-mock-redirect="crud-template.html">

        <div class="card mb-5">
          <h2 class="card-title">ข้อมูลทั่วไป</h2>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="form-name">ชื่อกิจกรรม<span class="form-required">*</span></label>
              <input class="input" id="form-name" value="ปลูกผักปลอดสารสำหรับครอบครัว" data-validate required>
            </div>
            <div class="form-group">
              <label class="form-label" for="form-program">โปรแกรมการเรียนรู้</label>
              <select class="select" id="form-program">
                <option>โครงการฟื้นฟูสุขภาวะชุมชน</option>
                <option>โครงการเกษตรเพื่อสุขภาพ</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="form-area">พื้นที่ดำเนินงาน<span class="form-required">*</span></label>
              <select class="select" id="form-area">
                <option>ชุมชนพูนทรัพย์ เขตสายไหม</option>
                <option>ศูนย์การเรียนรู้ The Farm Concept</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="form-target">กลุ่มเป้าหมาย</label>
              <select class="select" id="form-target">
                <option>กลุ่มเด็กและเยาวชน</option>
                <option>กลุ่มวัยทำงาน</option>
                <option>กลุ่มผู้สูงอายุ</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="form-desc">รายละเอียดกิจกรรม</label>
            <textarea class="textarea" id="form-desc">กิจกรรมเรียนรู้การปลูกผักปลอดสารพิษ เหมาะสำหรับครอบครัวที่ต้องการเริ่มต้นปลูกผักไว้รับประทานเอง</textarea>
          </div>
        </div>

        <div class="card mb-5">
          <h2 class="card-title">กำหนดการและจำนวนรับสมัคร</h2>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="form-start">วันที่เริ่มกิจกรรม<span class="form-required">*</span></label>
              <input class="input" type="date" id="form-start" value="2026-08-10" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="form-time">เวลา</label>
              <input class="input" type="time" id="form-time" value="09:00">
            </div>
            <div class="form-group">
              <label class="form-label" for="form-capacity">จำนวนรับสมัคร (คน)<span class="form-required">*</span></label>
              <input class="input" type="number" id="form-capacity" value="40" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="form-fee">ค่าลงทะเบียน (บาท)</label>
              <input class="input" type="number" id="form-fee" value="0">
            </div>
          </div>
          <div class="form-group">
            <label class="checkbox-item">
              <input type="checkbox" checked>
              <span class="small">เปิดรับสมัครทันทีเมื่อบันทึก</span>
            </label>
          </div>
        </div>

        <div class="card mb-5">
          <h2 class="card-title">ภาพปกกิจกรรม</h2>
          <div class="form-group mb-0">
            <div class="upload-zone" data-upload-zone data-upload-list="form-upload-list">
              <div class="upload-zone-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/></svg></div>
              <div class="small">ลากไฟล์ภาพมาวาง หรือคลิกเพื่อเลือกไฟล์ (JPG, PNG ไม่เกิน 5MB)</div>
              <input type="file" class="hidden" accept="image/*">
            </div>
            <div id="form-upload-list" class="upload-file-list"></div>
          </div>
        </div>

        <div class="form-action-bar">
          <button type="button" class="btn btn-outline" data-go-back>ยกเลิก</button>
          <button type="button" class="btn btn-secondary">บันทึกฉบับร่าง</button>
          <button type="submit" class="btn btn-primary">บันทึกข้อมูล</button>
        </div>
      </form>
    </main>
  </div>
</div>

<script src="assets/js/navigation.js"></script>
<script src="assets/js/modal.js"></script>
<script src="assets/js/action-menu.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/form.js"></script>
<script src="assets/js/smart-select.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
