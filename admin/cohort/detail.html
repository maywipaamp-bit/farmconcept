<!-- แจ้งเตือน LINE -->
<div class="modal-overlay" id="cd-line-modal">
  <div class="modal cd-line">
    <div class="modal-header">
      <h3 class="modal-title">แจ้งเตือนผ่าน LINE</h3>
      <button type="button" class="modal-close" data-close-modal aria-label="ปิด">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="cd-line-warn" id="cd-line-warn" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 8.5V13M12 16.5h.01"/><circle cx="12" cy="12" r="8.5"/></svg>
        <div class="cd-line-warn-body">
          <span>ยังไม่ผูก LINE — ส่งจากระบบไม่ได้ แต่คัดลอกข้อความไปส่งช่องทางอื่นได้ · ชวนให้ผูก LINE ด้วยลิงก์นี้จะได้ไม่ต้องตามเองทุกรอบ</span>
          <div class="copy-link">
            <code class="copy-link-url" id="cd-bind-url"></code>
            <button type="button" class="copy-link-btn" id="cd-bind-copy">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>
              <span id="cd-bind-text">คัดลอกลิงก์ผูก LINE</span>
            </button>
          </div>
        </div>
      </div>

      <div class="cd-field">
        <div class="cd-field-head">
          <span class="cd-field-label">ข้อความ</span>
          <button type="button" class="co-link" id="cd-line-reset">คืนค่าข้อความเริ่มต้น</button>
        </div>
        <textarea class="input cd-line-text" id="cd-line-msg" rows="4"></textarea>
      </div>

      <span class="cd-field-label">ตัวอย่างที่ผู้รับเห็น</span>
      <div class="cd-line-preview">
        <div class="cd-bubble">
          <span class="cd-bubble-text" id="cd-bubble-text"></span>
          <span class="cd-bubble-btn">ทำแบบประเมิน</span>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline" id="cd-line-copy">คัดลอกข้อความ</button>
      <button type="button" class="btn btn-primary" id="cd-line-send">ส่งแจ้งเตือน</button>
    </div>
  </div>
</div>

<!-- บันทึก/แก้ไขการซื้อสินค้า -->

      </button>
    </div>
    <form id="cd-order-form">
      <div class="modal-body">
        <div class="cd-order-grid" id="cd-order-grid"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost cd-order-delete" id="cd-order-delete" hidden>ลบรายการ</button>
        <button type="button" class="btn btn-outline" data-close-modal>ยกเลิก</button>
        <button type="submit" class="btn btn-primary">บันทึก</button>
      </div>
    </form>
  </div>
