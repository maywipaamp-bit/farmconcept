<!DOCTYPE html>
<html lang="th" class="is-preload">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แดชบอร์ด | TheFarmConcept</title>
<link rel="icon" type="image/png" href="../assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/css/standard/tokens.css">
<link rel="stylesheet" href="../assets/css/standard/base.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/utilities.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>

<div class="app-shell">
<script>(function(){try{if(localStorage.getItem('tfc-sidebar-collapsed')==='1'){document.currentScript.parentElement.classList.add('is-sidebar-collapsed');}}catch(e){}})();</script>
  <div class="sidebar-overlay"></div>

  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="../index.html" class="sidebar-brand">
        <img class="sidebar-logo" src="../assets/images/logo-farm.jpg" alt="The Farm Concept">
      </a>
      <button type="button" class="sidebar-toggle" data-sidebar-collapse-toggle aria-label="ย่อ/ขยายเมนู">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav" aria-label="เมนูหลัก" data-nav-base="../"></nav>
  </aside>

  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/menu-config.js"></script>
  <script src="../assets/js/sidebar-render.js"></script>

  <div class="app-main">
    <header class="topbar">
      <button type="button" class="topbar-menu-btn" data-sidebar-open aria-label="เปิดเมนู">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>

      <div class="topbar-breadcrumb">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <span class="is-current">แดชบอร์ด</span>
        </nav>
      </div>

      <div class="topbar-search hidden-mobile">
        <div class="search-input">
          <span class="search-input-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span>
          <input type="search" class="input" placeholder="ค้นหากิจกรรม ผู้ใช้งาน...">
        </div>
      </div>

      <div class="topbar-actions">

        <div class="dropdown">
          <button type="button" class="topbar-profile" data-dropdown-toggle aria-label="เมนูผู้ใช้งาน">
            <span class="avatar avatar-sm">สม<img src="../assets/images/avatar-default.png" alt="" onerror="this.remove()"></span>
            <span class="topbar-profile-info hidden-mobile">
              <span class="topbar-profile-name">สุนิสา แก้วมณี</span>
              <span class="topbar-profile-role">เจ้าหน้าที่โครงการ</span>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="dropdown-menu">
            <a class="dropdown-item" href="profile.html">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
              โปรไฟล์ของฉัน
            </a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item is-danger" href="../login.html">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
              ออกจากระบบ
            </a>
          </div>
        </div>
      </div>
    </header>

    <main class="content dash-content">
      <!-- A. หัวหน้า — ไม่มีปุ่มสลับโหมดใด ๆ ตามข้อกำหนด -->
      <div class="page-header">
        <div class="page-header-text">
          <h1>ภาพรวมระบบ</h1>
          <p class="page-description" id="dash-updated"></p>
        </div>
      </div>

      <!-- B. KPI 4 ใบ — คลิกไปหน้ารายละเอียดของแต่ละตัวเลข -->
      <div class="dash-kpis" id="dash-kpis"></div>

      <!-- C. กราฟหลัก 2 อัน -->
      <div class="dash-row">
        <section class="card dash-card dash-card-wide" aria-labelledby="dash-trend-title">
          <div class="dash-card-head">
            <h2 class="card-title" id="dash-trend-title">ผู้เข้าร่วมกิจกรรม จำแนกตามเดือน</h2>
          </div>
          <span class="dash-card-note" id="dash-trend-note"></span>
          <div class="dash-chart" id="dash-trend"></div>
        </section>

        <section class="card dash-card dash-card-narrow" aria-labelledby="dash-groups-title">
          <div class="dash-card-head">
            <h2 class="card-title" id="dash-groups-title">สัดส่วนผู้เข้าร่วมตามกลุ่มเป้าหมาย</h2>
          </div>
          <div class="dash-groups" id="dash-groups"></div>
        </section>
      </div>

      <!-- D. รายการที่ต้องลงมือทำ 2 อัน -->
      <div class="dash-row">
        <section class="card dash-card" aria-labelledby="dash-actions-title">
          <div class="dash-card-head">
            <h2 class="card-title" id="dash-actions-title">สิ่งที่ต้องติดตาม</h2>
            <span class="dash-count" id="dash-actions-count" hidden></span>
          </div>
          <div class="dash-list" id="dash-actions"></div>
        </section>

        <section class="card dash-card" aria-labelledby="dash-upcoming-title">
          <div class="dash-card-head">
            <h2 class="card-title" id="dash-upcoming-title">กิจกรรมที่จะจัดขึ้นเร็ว ๆ นี้</h2>
          </div>
          <div class="dash-list" id="dash-upcoming"></div>
        </section>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/data-service.js"></script>
<script src="../assets/js/navigation.js"></script>
<script src="../assets/js/modal.js"></script>
<script src="../assets/js/profile-modal.js"></script>
<script src="../assets/js/action-menu.js"></script>
<script src="../assets/js/index-layout.js"></script>
<script src="../assets/js/toast.js"></script>
<script src="../assets/js/app.js"></script>
<!-- ข้อมูลตัวอย่างแยกไฟล์จาก UI — สลับไป API จริงแก้ที่ dashboard-data.js ที่เดียว -->
<script src="../assets/js/dashboard-data.js"></script>
<script src="../assets/js/dashboard-overview.js"></script>
</body>
</html>
