<div class="modal-overlay" id="instructor-create-modal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 class="modal-title" id="instr-form-title">เพิ่มวิทยากร</h3>
      <button type="button" class="modal-close" data-close-modal aria-label="ปิดหน้าต่าง">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <!-- แท็บ: ข้อมูลวิทยากร / ประวัติการเป็นวิทยากร (ดึงจากกิจกรรมในระบบ) -->
    <div class="modal-tabs" data-tabs>
      <button type="button" class="tab-item is-active" data-tab-target="instr-tab-info">ข้อมูลวิทยากร</button>
      <button type="button" class="tab-item" data-tab-target="instr-tab-history">ประวัติการเป็นวิทยากร</button>
    </div>

    <form data-mock-submit="บันทึกวิทยากรสำเร็จ (ตัวอย่าง)" id="instr-form">
      <div class="modal-body" data-tab-panel="instr-tab-info">
        <!-- ภาพติดบัตรขนาดเล็กแบบใบสมัครงาน วางคู่กับชื่อ/เบอร์โทร -->
        <div class="photo-form-row mb-3">
          <div class="form-group mb-0">
            <label class="form-label">รูปภาพ</label>
            <div class="photo-slot" id="instr-photo-slot" tabindex="0" role="button" aria-label="เลือกรูปภาพวิทยากร">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <span>เพิ่มรูป</span>
              <input type="file" class="hidden" accept="image/*" id="instr-photo">
            </div>
          </div>
          <div>
            <div class="form-group">
              <label class="form-label" for="instr-name">ชื่อวิทยากร<span class="form-required">*</span></label>
              <input class="input" id="instr-name" data-validate required>
            </div>
            <div class="form-group mb-0">
              <label class="form-label" for="instr-phone">เบอร์โทร<span class="form-required">*</span></label>
              <input class="input" type="tel" id="instr-phone" data-validate required>
            </div>
          </div>
        </div>

        <div class="form-row mb-3">
          <div class="form-group mb-0">
            <label class="form-label">ความเชี่ยวชาญ</label>
            <div class="dynamic-row-list" id="instr-expertise-list"></div>
            <button type="button" class="dynamic-row-add" id="instr-add-expertise-btn" aria-label="เพิ่มความเชี่ยวชาญ" title="เพิ่มความเชี่ยวชาญ">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
          <div class="form-group mb-0">
            <label class="form-label">หลักสูตรที่สอน</label>
            <div class="dynamic-row-list" id="instr-course-list"></div>
            <button type="button" class="dynamic-row-add" id="instr-add-course-btn" aria-label="เพิ่มหลักสูตร" title="เพิ่มหลักสูตร">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="instr-bio">รายละเอียด</label>
          <textarea class="textarea" id="instr-bio" rows="3"></textarea>
        </div>
        <div class="form-group mb-0">
          <label class="form-label" for="instr-active">สถานะ<span class="form-required">*</span></label>
          <div class="flex items-center gap-2">
            <label class="switch"><input type="checkbox" id="instr-active" checked><span class="switch-track"></span></label>
            <span class="small text-secondary" id="instr-active-label">ใช้งาน</span>
          </div>
        </div>
      </div>

      <!-- ประวัติดึงจากกิจกรรมในระบบ ไม่ใช่ข้อมูลที่กรอกเอง จึงเป็นอ่านอย่างเดียว -->
      <div class="modal-body hidden" data-tab-panel="instr-tab-history">
        <div id="instr-history"></div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-close-modal>ยกเลิก</button>
        <button type="submit" class="btn btn-primary">บันทึก</button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  var pageState = { page: 1, pageSize: 10 };
  var instructorSvc = window.TFC.dataService('instructors');
  var mock = window.TFC_MOCK || {};

  function expertiseRowHtml(value) {
    return '<div class="dynamic-row">' +
      '<span class="dynamic-row-order" data-row-order></span>' +
      '<input class="input" placeholder="เช่น เกษตรอินทรีย์" value="' + window.TFC.escapeHtml(value) + '">' +
      '<button type="button" class="dynamic-row-remove" aria-label="ลบแถว">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>' +
      '</button></div>';
  }
  var expertiseList = window.TFC.dynamicRowList('instr-expertise-list', 'instr-add-expertise-btn', expertiseRowHtml);
  expertiseList.reset([]);

  /* หลักสูตรที่สอน — เก็บได้มากกว่า 1 โดยเลือกจากหลักสูตรในโปรแกรมการเรียนรู้ */
  var allCourses = (mock.programs || []).reduce(function (list, p) {
    return list.concat((p.courses || []).map(function (c) { return c.name; }));
  }, []);

  function courseRowHtml(value) {
    return '<div class="dynamic-row">' +
      '<span class="dynamic-row-order" data-row-order></span>' +
      /* ไม่ใส่ data-new-item-label เพื่อซ่อนปุ่ม "เพิ่มรายการใหม่" — เลือกได้เฉพาะหลักสูตรที่มีอยู่จริง
         จัดกลุ่มด้วย <optgroup> ตามโปรแกรม จะได้เห็นว่าหลักสูตรนั้นอยู่ใต้โปรแกรมใด */
      '<select class="select" data-smart-select>' +
      '<option value="">เลือกหลักสูตร</option>' +
      (mock.programs || []).map(function (p) {
        var courses = (p.courses || []);
        if (!courses.length) return '';
        return '<optgroup label="' + window.TFC.escapeHtml(p.name) + '">' +
          courses.map(function (c) {
            return '<option value="' + window.TFC.escapeHtml(c.name) + '"' + (c.name === value ? ' selected' : '') + '>' +
              window.TFC.escapeHtml(c.name) + '</option>';
          }).join('') + '</optgroup>';
      }).join('') +
      '</select>' +
      '<button type="button" class="dynamic-row-remove" aria-label="ลบแถว">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>' +
      '</button></div>';
  }
  var courseList = window.TFC.dynamicRowList('instr-course-list', 'instr-add-course-btn', courseRowHtml, function (row) {
    window.TFC.initSmartSelects(row);
  });
  courseList.reset([]);

  /* รูปภาพวิทยากร: กล่องเล็กแบบภาพติดบัตร เลือกไฟล์แล้วแสดงตัวอย่างในกล่องเดิม */
  var photoSlot = document.getElementById('instr-photo-slot');
  var photoInput = document.getElementById('instr-photo');
  var photoPlaceholder = photoSlot.innerHTML;

  function showPhoto(src) {
    photoSlot.innerHTML = src
      ? '<img src="' + src + '" alt="รูปวิทยากร">'
      : photoPlaceholder;
    /* innerHTML สร้าง input file ตัวใหม่ที่ไม่มี event ผูกอยู่ทุกครั้ง ต้องทิ้งตัวใหม่แล้วเอา
       ตัวจริงกลับเข้ามา — ทั้งกรณีมีรูปและไม่มีรูป ไม่งั้นหลังกด "เพิ่มวิทยากร" (ซึ่งเรียก
       showPhoto('')) จะเลือกรูปไม่ได้อีกเลย */
    var stale = photoSlot.querySelector('input[type="file"]');
    if (stale) stale.remove();
    photoSlot.appendChild(photoInput);
  }

  photoSlot.addEventListener('click', function () { photoInput.click(); });
  photoInput.addEventListener('click', function (e) { e.stopPropagation(); });
  photoInput.addEventListener('change', function () {
    window.TFC.readImageFile(photoInput.files[0], { maxMB: 5 }, showPhoto);
  });

    /* ยอดรวมย้ายจากแถวท้ายตารางมาไว้ใต้ชื่อหน้า คำนวณจากข้อมูลจริง */
  var instructorAll = mock.instructors || [];
window.TFC.renderPageHeader('instructor-page-header', {
    title: 'วิทยากร',
    description: 'ทั้งหมด ' + instructorAll.length + ' คน',
    actions: [
      {
        label: 'เพิ่มวิทยากร',
        icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
        attrs: { id: 'instr-add-btn', 'data-open-modal': 'instructor-create-modal' }
      }
    ]
  });

  document.getElementById('instr-active').addEventListener('change', function () {
    document.getElementById('instr-active-label').textContent = this.checked ? 'ใช้งาน' : 'ไม่ใช้งาน';
  });

  function resetForm() {
    document.getElementById('instr-form-title').textContent = 'เพิ่มวิทยากร';
    document.getElementById('instr-form').reset();
    document.getElementById('instr-active').checked = true;
    document.getElementById('instr-active-label').textContent = 'ใช้งาน';
    showPhoto('');
    expertiseList.reset([]);
    courseList.reset([]);
    document.getElementById('instr-form').setAttribute('data-editing-id', '');
    renderHistory(null);
    resetTabs();
  }

  /* กลับมาที่แท็บแรกเสมอเมื่อเปิด popup ใหม่ */
  function resetTabs() {
    document.querySelectorAll('#instructor-create-modal .tab-item').forEach(function (t, i) {
      t.classList.toggle('is-active', i === 0);
    });
    document.querySelectorAll('#instructor-create-modal [data-tab-panel]').forEach(function (p, i) {
      p.classList.toggle('hidden', i !== 0);
    });
  }

  /* ประวัติการเป็นวิทยากร — ดึงจากกิจกรรมในระบบ ไม่ใช่ข้อมูลที่กรอกเอง
     กิจกรรมเก็บชื่อวิทยากรไว้ใน instructorList (หลายคนได้) และ instructor (ชุดเดิม) จึงเช็คทั้งสองที่ */
  function historyOf(name) {
    return (mock.activities || []).filter(function (a) {
      var list = a.instructorList || (a.instructor ? [a.instructor] : []);
      return list.indexOf(name) !== -1;
    });
  }

  function renderHistory(instructor) {
    var box = document.getElementById('instr-history');
    if (!box) return;
    if (!instructor) {
      box.innerHTML = '<div class="empty-state"><p class="text-secondary">บันทึกวิทยากรก่อน ระบบจึงจะเริ่มเก็บประวัติการเป็นวิทยากรให้อัตโนมัติ</p></div>';
      return;
    }
    var rows = historyOf(instructor.name);
    if (!rows.length) {
      box.innerHTML = '<div class="empty-state"><p class="text-secondary">ยังไม่มีประวัติการเป็นวิทยากรในระบบ</p></div>';
      return;
    }
    var totalJoined = rows.reduce(function (s, a) { return s + (a.registered || 0); }, 0);
    box.innerHTML =
      '<p class="page-description mb-3">รวม ' + rows.length + ' กิจกรรม · ผู้เข้าร่วมสะสม ' + totalJoined.toLocaleString('th-TH') + ' คน</p>' +
      '<div class="table-wrapper"><div class="table-scroll"><table class="data-table is-header-filled">' +
      '<thead><tr><th class="col-no">#</th><th>ชื่อกิจกรรม</th><th>วันที่</th><th>พื้นที่</th><th>ผู้เข้าร่วม</th><th>สถานะ</th></tr></thead><tbody>' +
      rows.map(function (a, i) {
        return '<tr>' +
          '<td class="col-no">' + (i + 1) + '</td>' +
          '<td>' + window.TFC.escapeHtml(a.name) + '</td>' +
          '<td class="nowrap">' + (a.startDate ? window.TFC.formatThaiDate(a.startDate) : '-') + '</td>' +
          '<td>' + window.TFC.escapeHtml(a.area || '-') + '</td>' +
          '<td>' + (a.registered != null ? a.registered : '-') + '</td>' +
          '<td class="nowrap">' + window.TFC.statusTextHTML({ options: mock.activityStatuses, value: a.status }) + '</td>' +
          '</tr>';
      }).join('') +
      '</tbody></table></div></div>';
  }
  document.getElementById('instr-add-btn').addEventListener('click', resetForm);

  document.addEventListener('click', function (e) {
    var trigger = e.target.closest('[data-action-key^="instr-edit-"]');
    if (!trigger) return;
    var id = trigger.getAttribute('data-action-key').replace('instr-edit-', '');
    var instructor = (mock.instructors || []).filter(function (i) { return i.id === id; })[0];
    if (!instructor) return;
    document.getElementById('instr-form-title').textContent = 'แก้ไขวิทยากร';
    document.getElementById('instr-name').value = instructor.name || '';
    document.getElementById('instr-phone').value = instructor.phone || '';
    document.getElementById('instr-bio').value = instructor.bio || '';
    document.getElementById('instr-active').checked = instructor.active !== false;
    document.getElementById('instr-active-label').textContent = instructor.active !== false ? 'ใช้งาน' : 'ไม่ใช้งาน';
    showPhoto(instructor.photo || '');
    expertiseList.reset(instructor.expertiseList || []);
    courseList.reset(instructor.courseList || []);
    document.getElementById('instr-form').setAttribute('data-editing-id', instructor.id);
    renderHistory(instructor);
    resetTabs();
  });

  function renderTable() {
    instructorSvc.list().then(function (instructors) {
      var keyword = ((document.getElementById('instructor-search') || {}).value || '').trim().toLowerCase();
      var filtered = instructors.filter(function (i) {
        return !keyword || i.name.toLowerCase().indexOf(keyword) !== -1 ||
          (i.expertiseList || []).join(' ').toLowerCase().indexOf(keyword) !== -1;
      });

      var pageCount = Math.max(1, Math.ceil(filtered.length / pageState.pageSize));
      if (pageState.page > pageCount) pageState.page = pageCount;
      var start = (pageState.page - 1) * pageState.pageSize;
      var pageRows = filtered.slice(start, start + pageState.pageSize);

      document.getElementById('instructor-table-body').innerHTML = pageRows.map(function (i, idx) {
        var expertiseHtml = (i.expertiseList || []).length
          ? '<ul class="cell-bullets">' + i.expertiseList.map(function (e) { return '<li>' + window.TFC.escapeHtml(e) + '</li>'; }).join('') + '</ul>'
          : '<span class="text-secondary">-</span>';
        /* รูปวิทยากรเป็นวงกลมคู่กับชื่อ — ถ้ายังไม่มีรูปให้ขึ้นตัวย่อชื่อแทน
           ตัดคำนำหน้า (ดร./อาจารย์/คุณ ฯลฯ) ออกก่อน จะได้ตัวย่อจากชื่อจริง */
        var bare = (i.name || '').replace(/^(ดร\.|อาจารย์|คุณ|นาย|นางสาว|นาง|พยาบาลวิชาชีพ)\s*/, '').trim();
        var photoHtml = '<span class="cell-avatar">' + window.TFC.escapeHtml(bare.charAt(0) || '?') +
          (i.photo ? '<img src="' + window.TFC.escapeHtml(i.photo) + '" alt="">' : '') + '</span>';
        return '<tr>' +
          '<td class="col-no nowrap">' + (start + idx + 1) + '</td>' +
          '<td><span class="cell-person">' + photoHtml +
          '<span class="cell-person-name">' + window.TFC.escapeHtml(i.name) + '</span></span></td>' +
          '<td>' + window.TFC.escapeHtml(i.phone) + '</td>' +
          '<td>' + expertiseHtml + '</td>' +
          '<td><div class="cell-updated-by">' + window.TFC.escapeHtml(i.updatedBy || '-') + '</div>' +
          '<div class="cell-updated-at">' + (i.updatedAt ? window.TFC.formatThaiDate(i.updatedAt) : '-') + '</div></td>' +
          '<td class="table-row-actions">' +
          window.TFC.actionMenuTrigger([
            { key: 'instr-edit-' + i.id, label: 'แก้ไข', icon: 'edit', modal: 'instructor-create-modal', perm: 'master_data' },
            { key: 'instr-delete-' + i.id, label: 'ลบวิทยากร', icon: 'delete', modal: 'instructor-delete-modal', perm: 'master_data', danger: true }
          ]) +
          '</td></tr>';
      }).join('');
      /* แถวสรุปท้ายตารางถูกตัดออก — ยอดรวมย้ายไปอยู่บรรทัดใต้ชื่อหน้าแทน */

      window.TFC.renderPagination('instructor-pagination', {
        page: pageState.page,
        pageSize: pageState.pageSize,
        total: filtered.length,
        pageSizeOptions: [10, 20, 50],
        footer: true,
        onChange: function (p) { pageState.page = p; renderTable(); },
        onPageSizeChange: function (size) { pageState.pageSize = size; pageState.page = 1; renderTable(); }
      });
    });
  }

  /* แถบค้นหา/ตัวกรองย้ายเข้า Search Panel Popover — ใช้ id เดิมเพื่อให้ renderTable() อ่านค่าได้เหมือนเดิม */
  window.TFC.attachListToolbar({
    chipId: 'instructor-filter-chip',
    chipLabelId: 'instructor-filter-chip-label',
    popoverId: 'instructor-search-popover',
    search: { id: 'instructor-search', placeholder: 'ค้นหาชื่อวิทยากรหรือความเชี่ยวชาญ' },
    onApply: function (values, done) {
      pageState.page = 1;
      renderTable();
      done();
    }
  });

  /* ปุ่มดาวน์โหลดถูกตัดออกจากแถวชื่อหน้าแล้ว จึงผูก event เฉพาะเมื่อยังมีปุ่มอยู่
     ฟังก์ชัน exportTableCsv ยังอยู่ครบ ถ้าจะเอาปุ่มกลับมาก็เพิ่ม element id เดิมได้ทันที */
  var exportBtn = document.getElementById('instructor-export');
  if (exportBtn) {
    exportBtn.addEventListener('click', function () {
    window.TFC.exportTableCsv('#instructor-table-body', 'วิทยากร.csv');
    });
  }

  document.getElementById('instr-form').addEventListener('submit', function () {
    var editingId = this.getAttribute('data-editing-id');
    var expertiseValues = Array.from(expertiseList.container.querySelectorAll('input'))
      .map(function (input) { return input.value.trim(); })
      .filter(function (v) { return v; });
    var courseValues = Array.from(courseList.container.querySelectorAll('select'))
      .map(function (select) { return select.value; })
      .filter(function (v) { return v; });
    var photoImg = photoSlot.querySelector('img');
    var payload = {
      name: document.getElementById('instr-name').value,
      phone: document.getElementById('instr-phone').value,
      expertiseList: expertiseValues,
      expertise: expertiseValues.join(', '),
      courseList: courseValues,
      photo: photoImg ? photoImg.getAttribute('src') : '',
      bio: document.getElementById('instr-bio').value,
      active: document.getElementById('instr-active').checked,
      updatedBy: (mock.currentUser || {}).name || ''
    };
    var save = editingId ? instructorSvc.update(editingId, payload) : instructorSvc.create(Object.assign({ activityCount: 0 }, payload));
    save.then(renderTable);
  });

  renderTable();

  /* ลบรายการ: จำ id จากเมนู ⋮ แล้วลบจริงเมื่อกดยืนยันในโมดัล */
  var pendingDeleteId = null;
  document.addEventListener('click', function (e) {
    var item = e.target.closest('[data-action-key^="instr-delete-"]');
    if (item) pendingDeleteId = item.getAttribute('data-action-key').replace('instr-delete-', '');
  });

  document.getElementById('instr-delete-confirm').addEventListener('click', function () {
    if (!pendingDeleteId) return;
    instructorSvc.remove(pendingDeleteId).then(function () {
      pendingDeleteId = null;
      renderTable();
      if (window.TFC.showToast) window.TFC.showToast('ลบวิทยากรเรียบร้อย', 'success');
    });
  });
})();
</script>
</body>
</html>
